<div id="gp-root"></div>
<script id="gp-app">
(function(){
"use strict";
/* ---- src/schema/util.mjs ---- */
/* Small pure helpers shared by schema and engine. Ported verbatim from
   the v37 planner page (_archive/v37_reference) — behaviour must not drift (see tests/parity_html.mjs). */

function uid(p){ return p + Math.random().toString(36).slice(2,8); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function num(v, fb){ const n = parseFloat(v); return isFinite(n) ? n : (fb||0); }
/* rupee fields are typed with grouping separators; read the digits back out */
function mnum(v){ const n = parseFloat(String(v).replace(/[^0-9.-]/g, "")); return isFinite(n) ? n : 0; }

/* The date the holding values were taken from, as YYYY-MM-DD. Plans written
   before this was a full date carry YYYY-MM, or a bare year. */
function systemDate(now){
  const d = now || new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
                         + "-" + String(d.getDate()).padStart(2,"0");
}
function normDate(v, fallbackYear){
  const t = String(v == null ? "" : v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  if (/^\d{4}-\d{2}$/.test(t)) return t + "-01";
  if (/^\d{4}$/.test(t)) return t + "-01-01";
  return (fallbackYear || new Date().getFullYear()) + "-01-01";
}
function dateYear(v){ return parseInt(String(v).slice(0,4), 10); }
function asOfYear(s){ return dateYear(normDate(s.a.asOf)); }

/* ---- src/schema/plan.mjs ---- */
/* Plan schema: defaults, normalisation, load-time merge.
   Ported verbatim from the v37 planner page (_archive/v37_reference). Differences from the original
   are structural only (no globals, no DOM):
     - merge() returns {ok, state, error} instead of assigning a global and
       calling notice(); the refusal rule for newer data is unchanged.
     - rollForward() takes the "today" date as an argument.               */

const SCHEMA = 1;

/* Each holding says WHEN its gain is taxed, and at what rate. A rate of 0 is
   how an exempt holding is expressed. Starting points from Indian rules for
   FY 2025-26, editable per holding, not advice. */
const TAX_WHEN = [
  ["tax_on_withdrawal", "On withdrawal, on the gain"],
  ["tax_at_year_end",   "Every year, on the gain"]
];
const TAX_DEFAULTS = {
  "Equity":  {when:"tax_on_withdrawal", rate:0.125},
  "EPF-PPF": {when:"tax_on_withdrawal", rate:0},
  "NPS":     {when:"tax_on_withdrawal", rate:0.12},
  "Debt":    {when:"tax_on_withdrawal", rate:0.30},
  "Cash":    {when:"tax_at_year_end",   rate:0.30},
  "Property":{when:"tax_on_withdrawal", rate:0.125},
  "Other":   {when:"tax_on_withdrawal", rate:0}
};
function taxDefault(cat){ return TAX_DEFAULTS[cat] || TAX_DEFAULTS["Other"]; }
const CATS = ["Equity","EPF-PPF","NPS","Debt","Cash","Property","Other"];

const A = {
  retYear: s => s.a.currentYear + (s.a.retirementAge - s.a.currentAge),
  endYear: s => s.a.currentYear + (s.a.lifeExpectancy - s.a.currentAge)
};

/* The sample household: a made-up 38-year-old couple with one child,
   retiring at 58 on 75,000 a month in today's money. Nothing real belongs
   here. Withdraw order runs deposits, equity, PPF, EPF, NPS. */
function defaultState(){
  return {
    v: 2, schemaVersion: SCHEMA,
    a: {
      currentYear: 2026, currentAge: 38, retirementAge: 58, lifeExpectancy: 85,
      postRetReturn: 0.065, usePostRet: true,
      asOf: "2026-09-12", rolledThrough: 2025, cgExempt: 125000
    },
    investments: [
      {id:"i1", name:"Provident fund (EPF)", cat:"EPF-PPF", owner:"Self",  val:1800000, cost:1800000, add:180000, step:0.05, ret:0.075, until:null, avail:null, pri:4, on:true, taxWhen:"tax_on_withdrawal", taxRate:0},
      {id:"i2", name:"PPF",                  cat:"EPF-PPF", owner:"Self",  val:800000,  cost:800000,  add:150000, step:0,    ret:0.071, until:null, avail:null, pri:3, on:true, taxWhen:"tax_on_withdrawal", taxRate:0},
      {id:"i3", name:"Equity mutual funds",  cat:"Equity",  owner:"Joint", val:2200000, cost:1400000, add:300000, step:0.05, ret:0.105, until:null, avail:null, pri:2, on:true, taxWhen:"tax_on_withdrawal", taxRate:0.125},
      {id:"i4", name:"NPS",                  cat:"NPS",     owner:"Self",  val:600000,  cost:600000,  add:60000,  step:0,    ret:0.09,  until:null, avail:2048, pri:5, on:true, taxWhen:"tax_on_withdrawal", taxRate:0.12},
      {id:"i5", name:"Bank deposits",        cat:"Cash",    owner:"Joint", val:500000,  cost:500000,  add:0,      step:0,    ret:0.06,  until:null, avail:null, pri:1, on:true, taxWhen:"tax_at_year_end",   taxRate:0.30}
    ],
    goals: [
      {id:"g1", name:"New car",             kind:"onetime",   start:2030, end:2030, amt:1200000, infl:0.06, ess:false, on:true, isRet:false},
      {id:"g2", name:"Child's college",     kind:"onetime",   start:2040, end:2040, amt:2500000, infl:0.07, ess:true,  on:true, isRet:false},
      {id:"g3", name:"Retirement expenses", kind:"recurring", start:2046, end:2073, amt:900000,  infl:0.06, ess:true,  on:true, isRet:true}
    ],
    history: [
      {id:"h1", year:2022, actual:2150000, contribution:500000, note:"Started keeping a record", snaps:[]},
      {id:"h2", year:2023, actual:2940000, contribution:550000, note:"", snaps:[]},
      {id:"h3", year:2024, actual:3830000, contribution:600000, note:"Moved the SIP into index funds", snaps:[]},
      {id:"h4", year:2025, actual:4680000, contribution:640000, note:"Flat market year", snaps:[]},
      {id:"h5", year:2026, actual:5900000, contribution:690000, note:"", snaps:[
        {id:"s1", date:"2026-03-31", total:5480000, added:340000, note:"Q1 SIPs and PF"},
        {id:"s2", date:"2026-09-12", total:5900000, added:350000, note:""}]}
    ]
  };
}

/* Withdraw order is an ordinal: 1 is sold first. Distinct values are
   compressed to 1..n once ON LOAD (merge) — order and ties both survive.
   Never called from normalize(), which would rewrite the number under the
   cursor while it is being typed. */
function tidyOrder(s){
  const vals = Array.from(new Set(s.investments.map(i => num(i.pri, 50)))).sort((a,b) => a-b);
  const map = {}; vals.forEach((v,k) => map[v] = k + 1);
  s.investments.forEach(i => i.pri = map[num(i.pri, 50)]);
}

/* Holdings are kept in withdraw-priority order, ties broken by id. The engine is order-sensitive inside an equal-priority band
   (the shared exemption is consumed in order), so this makes the result
   independent of the order rows were typed in. */
function byWithdrawOrder(a, b){
  const d = num(a.pri, 50) - num(b.pri, 50);
  if (d) return d;
  const x = String(a.id), y = String(b.id);
  return x < y ? -1 : x > y ? 1 : 0;
}
function sortHoldings(s){ s.investments.sort(byWithdrawOrder); return s; }

function normalize(s){
  s.a.asOf = normDate(s.a.asOf, s.a.currentYear);
  s.a.currentYear = asOfYear(s);                      // the as-of date is the anchor
  if (s.a.rolledThrough == null) s.a.rolledThrough = s.a.currentYear - 1;
  if (s.a.cgExempt == null) s.a.cgExempt = 125000;
  delete s.a.taxOn; delete s.a.strategy;              // v25 fields, no longer used
  s.investments.forEach(i => {
    const d = taxDefault(i.cat);
    if (i.taxRate == null) i.taxRate = d.rate;
    if (i.taxWhen == null){
      i.taxWhen = (i.taxKind === "annual") ? "tax_at_year_end"
                : (i.taxKind ? "tax_on_withdrawal" : d.when);
    }
    if (i.taxWhen !== "tax_at_year_end" && i.taxWhen !== "tax_on_withdrawal")
      i.taxWhen = "tax_on_withdrawal";
    if (i.cost == null) i.cost = num(i.val);          // assume no embedded gain unless told
    if (i.pri == null) i.pri = 50;
    delete i.taxKind;
  });
  s.a.retirementAge = Math.max(s.a.currentAge, Math.min(s.a.retirementAge, s.a.lifeExpectancy));
  s.a.lifeExpectancy = Math.max(s.a.lifeExpectancy, s.a.retirementAge);
  const ry = A.retYear(s), ey = A.endYear(s);
  s.goals.forEach(g => {
    if (g.isRet){ g.kind = "recurring"; g.start = ry; g.end = ey; }
    if (g.kind === "onetime") g.end = g.start;
  });

  /* The as-of year always has a row, and that row is the holdings total.
     Snapshots recorded during the year live under it. */
  s.history.forEach(h => {
    if (!Array.isArray(h.snaps)) h.snaps = [];
    h.snaps.forEach(sn => { sn.date = normDate(sn.date, h.year); if (sn.id == null) sn.id = uid("sn"); });
    h.snaps.sort((a,b) => String(a.date).localeCompare(String(b.date)));
  });
  const liveY = asOfYear(s);
  let live = s.history.find(h => num(h.year) === liveY);
  if (!live){
    live = {id:uid("h"), year:liveY, actual:0, contribution:0, note:"", snaps:[]};
    s.history.push(live);
  }
  live.actual = s.investments.filter(i => i.on).reduce((t,i) => t + num(i.val), 0);
  /* a year with snapshots gets its contribution from them, not by hand */
  s.history.forEach(h => {
    if (h.snaps.length) h.contribution = h.snaps.reduce((t,sn) => t + num(sn.added), 0);
  });
  s.a.liveYear = liveY;
  return s;
}

/* Load-time merge. Newer data in an older page is refused, never trimmed. */
function merge(loaded){
  if (!loaded || typeof loaded !== "object") return {ok:false, error:"not a plan"};
  const d = defaultState();
  if (num(loaded.schemaVersion) > SCHEMA){
    return {ok:false, error:"newer", dataVersion: Math.round(num(loaded.schemaVersion)), pageVersion: SCHEMA};
  }
  const state = {
    v: 2, schemaVersion: SCHEMA,
    savedAt: loaded.savedAt || null,
    a: Object.assign({}, d.a, loaded.a || {}),
    investments: Array.isArray(loaded.investments) ? loaded.investments : d.investments,
    goals: Array.isArray(loaded.goals) ? loaded.goals : d.goals,
    history: Array.isArray(loaded.history) ? loaded.history : d.history
  };
  if (loaded.a && !loaded.a.asOf && loaded.a.currentYear){
    state.a.asOf = Math.round(num(loaded.a.currentYear)) + "-01";
    state.a.rolledThrough = Math.round(num(loaded.a.currentYear)) - 1;
  }
  state.history.forEach(h => { if (!h.id) h.id = uid("h"); });
  tidyOrder(state);
  state.investments.forEach(i => { if (!i.id) i.id = uid("i"); });
  state.goals.forEach(g => { if (!g.id) g.id = uid("g"); });
  sortHoldings(state);
  normalize(state);
  return {ok:true, state};
}

/* Year rollover. A finished calendar year becomes a history row; the amount
   invested in it is left at zero deliberately. `today` is injected. */
function rollForward(state, today){
  const now = today || new Date();
  const sysY = now.getFullYear();
  const from = asOfYear(state);
  if (from >= sysY || num(state.a.rolledThrough) >= sysY - 1){
    if (num(state.a.rolledThrough) < sysY - 1) state.a.rolledThrough = sysY - 1;
    return null;
  }
  const undo = clone(state);
  const total = state.investments.filter(i => i.on).reduce((t,i) => t + num(i.val), 0);
  const closed = [];
  for (let y = from; y < sysY; y++){
    if (!state.history.some(h => num(h.year) === y)){
      state.history.push({id:uid("h"), year:y, actual:total, contribution:0, snaps:[],
        note:"Carried forward automatically — replace with the real year-end figure"});
    }
    closed.push(y);
  }
  state.a.rolledThrough = sysY - 1;
  state.a.asOf = systemDate(now);
  normalize(state);
  return {years: closed, to: sysY, undo};
}

/* Opening a file also LINKS it, so "is this actually a plan?" has teeth:
   pointing at an unrelated .json and then saving would overwrite it. */
function looksLikePlan(o){
  return !!o && typeof o === "object" && !Array.isArray(o)
      && (Array.isArray(o.investments) || Array.isArray(o.goals));
}

/* ---- src/schema/file.mjs ---- */
/* goal_plan.json — reading and writing the data file.

   Written: strict JSON, 2-space indent, stable key order with schemaVersion
   first, money as plain integer rupees. Read: that, or a legacy plan.js
   carrying `window.PLAN = {…}` (migration only; .js is never written).

   Holdings are written in withdraw-priority order, ties by id — the same
   order the engine uses, so the file reads the way the money is drawn.
   Goals keep their order; history is written by year. */


const KEY_ORDER = {
  root:  ["schemaVersion", "v", "savedAt", "a", "investments", "goals", "history"],
  a:     ["asOf", "currentYear", "currentAge", "retirementAge", "lifeExpectancy",
          "postRetReturn", "usePostRet", "cgExempt", "rolledThrough", "liveYear", "noEstimate"],
  inv:   ["id", "name", "cat", "owner", "val", "cost", "add", "step", "ret",
          "until", "avail", "pri", "on", "taxWhen", "taxRate"],
  goal:  ["id", "name", "kind", "start", "end", "amt", "infl", "ess", "on", "isRet"],
  hist:  ["id", "year", "actual", "contribution", "estimated", "note", "snaps"],
  snap:  ["id", "date", "total", "added", "note", "byInv"]
};
const MONEY = {
  inv: ["val", "cost", "add"], goal: ["amt"], hist: ["actual", "contribution"],
  snap: ["total", "added"], a: ["cgExempt"]
};

function ordered(obj, keys, money){
  const out = {};
  for (const k of keys) if (k in obj && obj[k] !== undefined) out[k] = obj[k];
  /* anything unknown is kept, after the known keys, alphabetically — a newer
     field must never be dropped by an older writer */
  Object.keys(obj).filter(k => !keys.includes(k)).sort()
    .forEach(k => { if (obj[k] !== undefined) out[k] = obj[k]; });
  for (const k of (money || [])) if (typeof out[k] === "number") out[k] = Math.round(out[k]);
  return out;
}

function toFileObject(state){
  const r = ordered(state, KEY_ORDER.root);
  r.a = ordered(state.a, KEY_ORDER.a, MONEY.a);
  r.investments = state.investments.slice().sort(byWithdrawOrder).map(i => ordered(i, KEY_ORDER.inv, MONEY.inv));
  r.goals = state.goals.map(g => ordered(g, KEY_ORDER.goal, MONEY.goal));
  r.history = state.history.slice().sort((x, y) => x.year - y.year).map(h => {
    const o = ordered(h, KEY_ORDER.hist, MONEY.hist);
    o.snaps = (h.snaps || []).map(sn => {
      const s = ordered(sn, KEY_ORDER.snap, MONEY.snap);
      if (s.byInv){
        const b = {};
        Object.keys(s.byInv).sort().forEach(k => b[k] = Math.round(s.byInv[k]));
        s.byInv = b;
      }
      return s;
    });
    return o;
  });
  return r;
}

function serialiseJson(state){
  return JSON.stringify(toFileObject(state), null, 2) + "\n";
}

/* Read a plan out of whatever was handed over: goal_plan.json, or a legacy
   plan.js. The wrapper is peeled deliberately rather than by hunting for the
   first "=" or "{", either of which a comment could contain. */
function parsePlanText(text){
  let t = String(text).replace(/^﻿/, "").trim();
  t = t.replace(/^\/\*[\s\S]*?\*\//, "").trim();
  while (/^\/\//.test(t)) t = t.replace(/^\/\/[^\n]*\n?/, "").trim();
  t = t.replace(/^(?:window\s*\.\s*)?[\w$]+\s*=\s*/, "");   // window.PLAN = / window.GOAL_PLAN =
  t = t.replace(/;\s*$/, "");
  return JSON.parse(t);
}

/* Backup names: goal_plan_<YYYYMMDD-HHMMSS>.json, sortable, never localised. */
function backupName(d){
  const p = n => String(n).padStart(2, "0");
  return "goal_plan_" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate())
       + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + ".json";
}

/* ---- src/schema/history.mjs ---- */
/* Phase 4b — one estimated prior history year.

   The on-track comparison needs two closed years. With only one recorded,
   a single prior year is worked back from it by reversing the engine's own
   mid-year convention exactly (track() runs  close = prev + c + (prev + c/2)·r):

       prev = (close − c·(1 + r/2)) / (1 + r)

   r is the same value-weighted return track() assumes; c is what went in
   during the recorded year (its own figure when there is one, otherwise the
   plan's annual investing de-escalated by each holding's step-up).

   THE TRAP: a year derived from the plan's own return sits on the planned
   curve by construction, so its "gap" is zero by definition. It is therefore
   stored as `estimated: true`, drawn hollow and dashed, and kept OUT of the
   gap statistic and the on-track headline (see track()). It exists only to
   give the chart a second point and a slope.

   One year back only. Never derived over a real figure: typing a value into
   the row clears the flag (ui/events.js), and a row that is not estimated is
   never touched here. Deleting the row sets a.noEstimate so it stays gone.  */

function estimateNote(fromYear, r){
  return `Estimated, not a recorded value: worked back from ${fromYear} at the plan's `
    + `${(r * 100).toFixed(2)}% assumed return.`;
}

/* Returns true when it added or re-derived a row. Pure apart from mutating s. */
function ensureEstimate(s){
  if (!s || !Array.isArray(s.history) || (s.a && s.a.noEstimate)) return false;
  const liveY = asOfYear(s);
  const recorded = s.history.filter(h => num(h.year) < liveY && !h.estimated)
                            .sort((a, b) => num(a.year) - num(b.year));
  if (recorded.length !== 1) return false;
  const base = recorded[0], y = num(base.year) - 1;
  let row = s.history.find(h => num(h.year) === y);
  if (row && !row.estimated) return false;                 // never over a real one

  const on = s.investments.filter(i => i.on);
  const tot = on.reduce((t, i) => t + num(i.val), 0);
  const r = tot ? on.reduce((t, i) => t + num(i.val) * num(i.ret), 0) / tot : 0.08;
  const planAdd = yr => on.reduce((t, i) => t + num(i.add) / Math.pow(1 + num(i.step), s.a.currentYear - yr), 0);
  const c = num(base.contribution) > 0 ? num(base.contribution) : planAdd(num(base.year));
  const prev = (num(base.actual) - c * (1 + r / 2)) / (1 + r);
  if (!(prev > 0)) return false;                           // nothing sensible to show

  const want = {actual: Math.round(prev), contribution: Math.round(planAdd(y)), note: estimateNote(y + 1, r)};
  if (!row){
    row = {id: uid("h"), year: y, estimated: true, snaps: []};
    s.history.push(row);
  } else if (row.actual === want.actual && row.contribution === want.contribution && row.note === want.note){
    return false;
  }
  Object.assign(row, want);
  return true;
}

/* ---- src/engine/project.mjs ---- */
/* Ported verbatim from the v37 planner page (_archive/v37_reference). The ONLY place maths lives.
   Do not edit without re-running tests/parity_html.mjs. */

/* Growth uses the mid-year convention:
   growth = (opening + contribution/2) * return                              */
function project(s){
  const a = s.a, ry = A.retYear(s), ey = A.endYear(s);
  /* withdraw-priority order, ties by id: the one deliberate change from v37 */
  const inv = s.investments.filter(i => i.on).sort(byWithdrawOrder);
  const goals = s.goals.filter(g => g.on);
  const byId = {}; inv.forEach(i => byId[i.id] = i);

  const bal = {}, basis = {};
  inv.forEach(i => { bal[i.id] = num(i.val); basis[i.id] = num(i.cost, num(i.val)); });

  const paid = {}, due = {}, firstShort = {};
  goals.forEach(g => { paid[g.id]=0; due[g.id]=0; firstShort[g.id]=null; });

  const years = []; let depletion = null, totalTax = 0;

  for (let y = a.currentYear; y <= ey; y++){
    const phase = y < ry ? "Accumulation" : "Retirement";
    const opening = inv.reduce((t,i) => t + bal[i.id], 0);

    const contrib = {};
    inv.forEach(i => {
      const stop = (i.until == null) ? ry - 1 : i.until;
      contrib[i.id] = (y <= stop && i.add) ? num(i.add) * Math.pow(1 + num(i.step), y - a.currentYear) : 0;
    });
    const contribTotal = inv.reduce((t,i) => t + contrib[i.id], 0);

    /* Growth is reported gross. A holding taxed as it accrues settles up the
       same year, so its tax never compounds — and what survives has already
       been taxed, which is why it joins the cost base below. */
    const grow = {}, yearTax = {};
    inv.forEach(i => {
      let r = num(i.ret);
      if (a.usePostRet && y >= ry) r = num(a.postRetReturn);
      const g = (bal[i.id] + contrib[i.id]/2) * r;
      grow[i.id] = g;
      yearTax[i.id] = (i.taxWhen === "tax_at_year_end" && g > 0) ? g * num(i.taxRate) : 0;
    });
    const growthTotal = inv.reduce((t,i) => t + grow[i.id], 0);
    const accrualTax = inv.reduce((t,i) => t + yearTax[i.id], 0);

    const pre = {}, preBasis = {};
    inv.forEach(i => {
      pre[i.id] = bal[i.id] + contrib[i.id] + grow[i.id] - yearTax[i.id];
      preBasis[i.id] = basis[i.id] + contrib[i.id]
        + (i.taxWhen === "tax_at_year_end" ? grow[i.id] - yearTax[i.id] : 0);
    });

    /* Every withdrawal takes principal and gain in the same proportion as the
       holding, so the gain fraction survives the draw untouched and can be
       fixed once a year — only that fraction of what comes out is taxed. */
    const gainFrac = {};
    inv.forEach(i => gainFrac[i.id] = pre[i.id] > 0
      ? Math.max(0, pre[i.id] - preBasis[i.id]) / pre[i.id] : 0);

    const openIds = inv.filter(i => i.avail == null || y >= i.avail).map(i => i.id);
    const wd = {}, wdTaxPer = {}; inv.forEach(i => { wd[i.id] = 0; wdTaxPer[i.id] = 0; });
    const yearGoals = []; let shortfall = 0, wdTax = 0;
    let exemptLeft = num(a.cgExempt);

    /* Draw order: the lowest number goes first. Holdings sharing a number give
       equal rupee amounts — not amounts proportional to their size — and when
       one runs dry the others in that band cover what it could not. Locked
       holdings are simply absent from openIds until their year arrives. */
    const tiers = [];
    const byPri = {};
    openIds.forEach(id => { const p = num(byId[id].pri, 50); (byPri[p] = byPri[p] || []).push(id); });
    Object.keys(byPri).map(Number).sort((p,q) => p - q).forEach(p => tiers.push(byPri[p]));

    function split(G){
      const per = {}; openIds.forEach(id => per[id] = 0);
      if (G <= 0) return per;
      let left = G;
      for (const tier of tiers){
        if (left <= 1e-9) break;
        let pool = tier.filter(id => (pre[id] - wd[id]) > 1e-9);
        while (pool.length && left > 1e-9){
          const share = left / pool.length;
          let used = 0; const next = [];
          for (const id of pool){
            const avail = pre[id] - wd[id] - per[id];
            const take = Math.min(share, avail);
            per[id] += take; used += take;
            if (avail - take > 1e-9) next.push(id);
          }
          left -= used;
          if (used <= 1e-12) break;          // nothing left to give in this band
          pool = next;
        }
      }
      return per;
    }

    /* On the way out, only holdings in the withdrawal category owe anything —
       the year-end ones have already paid. A rate of 0 means exempt. */
    function drawTax(id, gross, exLeft){
      const i = byId[id];
      if (gross <= 0 || i.taxWhen !== "tax_on_withdrawal") return {tax:0, ex:0};
      const rate = num(i.taxRate);
      if (rate <= 0) return {tax:0, ex:0};
      const gain = gross * gainFrac[id];
      const ex = Math.min(gain, Math.max(exLeft, 0));
      return {tax: Math.max(0, gain - ex) * rate, ex};
    }

    function netOf(G){
      const per = split(G), taxPer = {};
      let tax = 0, ex = exemptLeft, gross = 0;
      for (const id of openIds){
        if (per[id] <= 0) continue;
        const r = drawTax(id, per[id], ex);
        taxPer[id] = r.tax;
        tax += r.tax; ex -= r.ex; gross += per[id];
      }
      return {per, taxPer, tax, gross, net: gross - tax, exLeft: ex};
    }

    const demands = [];
    goals.forEach(g => {
      if (y < g.start || y > g.end) return;
      const amt = num(g.amt) * Math.pow(1 + num(g.infl), y - a.currentYear);
      if (amt > 0){ demands.push({g, amt}); due[g.id] += amt; }
    });
    demands.sort((x,z) => (x.g.ess === z.g.ess) ? x.g.start - z.g.start : (x.g.ess ? -1 : 1));

    const anyTax = openIds.some(id => byId[id].taxWhen === "tax_on_withdrawal"
      && num(byId[id].taxRate) > 0 && gainFrac[id] > 0);

    demands.forEach(({g, amt}) => {
      let pool = 0; openIds.forEach(id => pool += Math.max(pre[id] - wd[id], 0));
      const cap = netOf(pool);
      let res;
      if (cap.net <= amt + 1e-6){
        res = cap;                                  // everything left, still short
      } else if (!anyTax){
        res = netOf(amt);                           // no tax in the way
      } else {
        /* gross up: find the draw whose after-tax proceeds meet the goal */
        let lo = 0, hi = pool;
        for (let k = 0; k < 34; k++){
          const mid = (lo + hi) / 2;
          if (netOf(mid).net < amt) lo = mid; else hi = mid;
        }
        res = netOf(hi);
      }
      const take = Math.min(res.net, amt);
      const short = Math.max(amt - res.net, 0);
      if (short > 1e-6 && firstShort[g.id] == null) firstShort[g.id] = y;
      shortfall += short; paid[g.id] += take;
      openIds.forEach(id => { wd[id] += res.per[id]; wdTaxPer[id] += (res.taxPer[id] || 0); });
      exemptLeft = res.exLeft;
      wdTax += res.tax;
      yearGoals.push({id:g.id, name:g.name, isRet:!!g.isRet, due:amt, paid:take, short, tax:res.tax});
    });

    const taxThisYear = accrualTax + wdTax;
    totalTax += taxThisYear;

    inv.forEach(i => {
      const w = wd[i.id];
      bal[i.id] = pre[i.id] - w;
      basis[i.id] = Math.max(0, preBasis[i.id] - w * (1 - gainFrac[i.id]));
    });
    const closing = inv.reduce((t,i) => t + bal[i.id], 0);
    const grossOut = inv.reduce((t,i) => t + wd[i.id], 0);
    if (depletion == null && closing <= 1 && grossOut > 0) depletion = y;

    const goalSpend = yearGoals.filter(g => !g.isRet).reduce((t,g) => t + g.paid, 0);
    const retSpend  = yearGoals.filter(g =>  g.isRet).reduce((t,g) => t + g.paid, 0);

    /* what the corpus still owes on gains it has not realised */
    /* only the withdrawal category carries a liability into the future;
       the year-end ones have settled everything they owe */
    const embedded = inv.reduce((t,i) => i.taxWhen === "tax_on_withdrawal"
      ? t + Math.max(0, bal[i.id] - basis[i.id]) * num(i.taxRate) : t, 0);

    years.push({
      year:y, age: a.currentAge + (y - a.currentYear), phase,
      opening, contribution:contribTotal, growth:growthTotal,
      withdrawal:goalSpend + retSpend, tax:taxThisYear,
      outflow: goalSpend + retSpend + taxThisYear,
      goalSpend, retSpend, shortfall, closing, embeddedTax: embedded,
      goals: yearGoals,
      byInv: inv.reduce((o,i) => (o[i.id] = {
        opening: pre[i.id] - contrib[i.id] - grow[i.id] + yearTax[i.id],
        basisOpen: preBasis[i.id] - contrib[i.id]
          - ((i.taxWhen === "tax_at_year_end") ? grow[i.id] - yearTax[i.id] : 0),
        contribution: contrib[i.id], growth: grow[i.id],
        withdrawal: wd[i.id], closing: bal[i.id],
        /* two different taxes, kept apart: one charged on this year's growth
           whether or not anything was withdrawn, the other on the gain inside
           what was sold */
        taxYear: yearTax[i.id], taxDraw: wdTaxPer[i.id] || 0
      }, o), {})
    });
  }

  const goalStatus = goals.map(g => {
    const d = due[g.id], p = paid[g.id];
    let st = "Not scheduled";
    if (d > 0) st = (p >= d - 1) ? "Funded" : (p <= 1 ? "Unfunded" : "Partial");
    return {id:g.id, name:g.name, kind:g.kind, start:g.start, end:g.end, isRet:!!g.isRet,
            ess:!!g.ess, due:d, paid:p, short:Math.max(d-p,0), status:st, firstShort:firstShort[g.id]};
  });

  const byYear = {}; years.forEach(y => byYear[y.year] = y);
  const atRet = byYear[ry] ? byYear[ry].opening : (years[0] ? years[0].opening : 0);
  const disc = num(a.postRetReturn);
  let required = 0;
  years.forEach(y => {
    if (y.year < ry) return;
    const d = y.goals.reduce((t,g) => t + g.due, 0);
    required += d / Math.pow(1 + disc, y.year - ry + 0.5);
  });
  let peak = years[0] || null;
  years.forEach(y => { if (!peak || y.closing > peak.closing) peak = y; });
  const totalShort = years.reduce((t,y) => t + y.shortfall, 0);
  const curCorpus = inv.reduce((t,i) => t + num(i.val), 0);
  const embeddedNow = inv.reduce((t,i) => i.taxWhen === "tax_on_withdrawal"
    ? t + Math.max(0, num(i.val) - num(i.cost, num(i.val))) * num(i.taxRate) : t, 0);

  return {
    years, goalStatus,
    m: {
      currentCorpus: curCorpus,
      embeddedTaxNow: embeddedNow,
      afterTaxNow: curCorpus - embeddedNow,
      totalTax,
      annualContribution: inv.reduce((t,i) => t + ((i.until==null || i.until>=a.currentYear) ? num(i.add) : 0), 0),
      blendedReturn: curCorpus ? inv.reduce((t,i) => t + num(i.val)*num(i.ret), 0)/curCorpus : 0,
      retirementYear: ry, endYear: ey,
      corpusAtRetirement: atRet, requiredAtRetirement: required,
      surplus: atRet - required,
      finalCorpus: years.length ? years[years.length-1].closing : 0,
      peakCorpus: peak ? peak.closing : 0, peakYear: peak ? peak.year : null,
      depletionYear: depletion, totalShortfall: totalShort,
      allFunded: goalStatus.every(g => g.status === "Funded" || g.status === "Not scheduled"),
      totalGoalSpend: goalStatus.reduce((t,g) => t + g.due, 0),
      depletionAge: depletion == null ? null : a.currentAge + (depletion - a.currentYear)
    }
  };
}

/* ---- src/engine/track.mjs ---- */
/* Ported from the v37 planner page (_archive/v37_reference); the one change is Phase 4b's handling
   of estimated rows, which is a no-op for any history without them. */

/* History / on-track: planned vs actual across closed years. */
function track(s){
  const liveY = asOfYear(s);
  const all = s.history.slice().sort((x,y) => num(x.year) - num(y.year));
  /* The year still running holds a part-year figure. Measuring it against a
     whole year of predicted growth would read as "behind" when nothing is
     wrong, so it sits out of the comparison until it closes. */
  const withEst = all.filter(r => num(r.year) < liveY);
  /* Phase 4b: an estimated year is never evidence. It is left out of the
     comparison entirely; with fewer than two RECORDED years the result is a
     sketch — planned values for the chart's slope, no gap, no headline. */
  const closed = withEst.filter(r => !r.estimated);
  const bare = extra => Object.assign({
    rows: all.map(r => Object.assign({}, r, {planned:null, gap:null, inProgress:num(r.year) === liveY})),
    enough:false
  }, extra || {});

  const inv = s.investments.filter(i => i.on);
  const tot = inv.reduce((t,i) => t + num(i.val), 0);
  const assumed = tot ? inv.reduce((t,i) => t + num(i.val)*num(i.ret), 0)/tot : 0.08;

  if (closed.length < 2){
    if (withEst.length < 2) return bare();
    const p = [num(withEst[0].actual)];
    for (let k = 1; k < withEst.length; k++){
      const prev = p[k-1], c = num(withEst[k].contribution);
      p.push(prev + c + (prev + c/2) * assumed);
    }
    const at = {}; withEst.forEach((r,k) => at[r.id] = p[k]);
    return {
      rows: all.map(r => Object.assign({}, r, {planned: at[r.id] != null ? at[r.id] : null, gap:null,
                                               inProgress: num(r.year) === liveY})),
      enough:false, sketch:true, assumed
    };
  }
  const run = rate => {
    const out = [num(closed[0].actual)];
    for (let k = 1; k < closed.length; k++){
      const prev = out[k-1], c = num(closed[k].contribution);
      out.push(prev + c + (prev + c/2) * rate);
    }
    return out;
  };
  const planned = run(assumed);
  let lo = -0.5, hi = 0.6;
  for (let k = 0; k < 160; k++){
    const mid = (lo+hi)/2;
    if (run(mid)[closed.length-1] < num(closed[closed.length-1].actual)) lo = mid; else hi = mid;
  }
  const implied = (lo+hi)/2;
  const last = num(closed[closed.length-1].actual), lastP = planned[planned.length-1];
  const at = {}; closed.forEach((r,k) => at[r.id] = planned[k]);
  return {
    rows: all.map(r => {
      const p = at[r.id];
      return Object.assign({}, r, p == null
        ? {planned:null, gap:null, inProgress:num(r.year) === liveY}
        : {planned:p, gap:num(r.actual) - p, inProgress:false});
    }),
    enough:true, assumed, implied, gap:last-lastP,
    gapPct: lastP ? (last-lastP)/lastP : 0,
    span: num(closed[closed.length-1].year) - num(closed[0].year)
  };
}

/* ---- src/engine/required.mjs ---- */
/* Ported from the v37 planner page (_archive/v37_reference). The ONLY place maths lives.
   One deliberate change (v1.3.0): holdings still LOCKED in a year
   keep their projected balance instead of being scaled with the rest — see
   below. With no lock-ins the curve is identical to v37's. */

/* The corpus needed at the start of each year for every remaining goal to be
   met in full, ASSUMING planned contributions continue. Goal amt and holding
   add are re-quoted to year t before each trial. */
function requiredCurve(s, proj){
  const years = proj.years, out = new Array(years.length).fill(null);
  const live = s.investments.filter(i => i.on);
  if (!live.length) return out;

  const dueFrom = new Array(years.length + 1).fill(0);
  for (let i = years.length - 1; i >= 0; i--)
    dueFrom[i] = dueFrom[i+1] + years[i].goals.reduce((t,g) => t + g.due, 0);

  const base = s.a.currentYear;
  const p = clone(s);
  p.investments = p.investments.filter(i => i.on);
  const addBase = p.investments.map(i => num(i.add));
  const goalBase = p.goals.map(g => ({amt: num(g.amt), infl: num(g.infl)}));

  for (let i = 0; i < years.length; i++){
    const y = years[i];
    if (dueFrom[i] <= 0){ out[i] = 0; continue; }

    p.a.currentYear = y.year;
    p.a.currentAge  = y.age;
    /* amounts are quoted in base-year money and escalate from currentYear,
       so both goals and contributions are re-quoted to this year */
    p.goals.forEach((g,k) => g.amt = goalBase[k].amt * Math.pow(1 + goalBase[k].infl, y.year - base));
    p.investments.forEach((inv,k) => inv.add = addBase[k] * Math.pow(1 + num(inv.step), y.year - base));

    /* A holding locked this year (NPS until 2048, say) cannot pay for anything
       until it opens, so scaling it up with the rest asks the wrong question —
       once the open holdings run dry the corpus would be "all NPS" and no
       amount of it could fund the next year, leaving gaps and spikes in the
       curve. Locked holdings are therefore held at their projected balance;
       the search is over what the OPEN holdings need, in their own mix, and
       the requirement is that plus the locked balances. */
    const locked = live.map(inv => inv.avail != null && y.year < num(inv.avail));
    const anyOpen = locked.some(l => !l);
    let tot = 0, fixed = 0; const w = [], bf = [], hold = [];
    live.forEach((inv,k) => {
      const b = y.byInv[inv.id] || {opening:0, basisOpen:0};
      const o = Math.max(b.opening, 0);
      bf[k] = o > 0 ? Math.min(Math.max(b.basisOpen,0) / o, 1) : 1;
      if (anyOpen && locked[k]){ hold[k] = o; fixed += o; w[k] = 0; }
      else { hold[k] = null; w[k] = o; tot += o; }
    });
    const nFree = live.filter((inv,k) => hold[k] == null).length;
    live.forEach((inv,k) => { if (hold[k] == null) w[k] = tot > 0 ? w[k]/tot : 1/nFree; });

    const trial = C => {
      for (let k = 0; k < p.investments.length; k++){
        const v = hold[k] != null ? hold[k] : C * w[k];
        p.investments[k].val = v;
        p.investments[k].cost = v * bf[k];
      }
      return project(p).m.totalShortfall < 1;
    };

    let hi = (out[i+1] != null ? out[i+1] - fixed : 0) + dueFrom[i] + 1, guard = 0;
    if (hi < 1) hi = dueFrom[i] + 1;
    while (guard++ < 12 && !trial(hi)) hi *= 2;
    if (!trial(hi)){ out[i] = null; continue; }
    let lo = 0;
    for (let k = 0; k < 13; k++){ const mid = (lo+hi)/2; if (trial(mid)) hi = mid; else lo = mid; }
    out[i] = hi + fixed;
  }
  return out;
}

/* requiredCurve is a START-of-year figure; everything else is end-of-year.
   Shift one year left so the band lines up with the chart. */
function reqEndFor(years, curve){
  const r = (curve && curve.length === years.length) ? curve : null;
  return r ? years.map((y,i) => (i + 1 < r.length ? r[i+1] : 0)) : null;
}

/* ---- src/engine/solvers.mjs ---- */
/* Ported verbatim from the v37 planner page (_archive/v37_reference). The ONLY place maths lives.
   Do not edit without re-running tests/parity_html.mjs. */

function survives(s){ return project(s).m.totalShortfall < 1; }

/* Add (or remove) a lump sum today, spread across holdings in proportion to
   their size. Money going in is new principal; money coming out takes
   principal and gain in the same proportion as the holding, the same rule the
   engine uses for every other withdrawal. */
function withLump(s, delta){
  const p = clone(s);
  const on = p.investments.filter(i => i.on);
  const tot = on.reduce((t,i) => t + num(i.val), 0);
  if (tot <= 0) return p;
  on.forEach(i => {
    const v = num(i.val), c = num(i.cost, v), d = delta * (v / tot);
    if (d >= 0){ i.val = v + d; i.cost = c + d; }
    else {
      const take = Math.min(-d, v);
      const principalShare = v > 0 ? Math.min(c / v, 1) : 1;
      i.val = v - take;
      i.cost = Math.max(0, c - take * principalShare);
    }
  });
  return p;
}

function solveAll(s){
  const out = {retireAge:null, contribMult:null, sustainable:null, lumpToday:null};

  /* the earliest retirement age that still funds everything — below the
     current age this reads as slack, above it as the price of the gap */
  for (let age = s.a.currentAge; age <= Math.min(s.a.lifeExpectancy, 80); age++){
    const p = normalize(clone(s)); p.a.retirementAge = age; normalize(p);
    if (survives(p)){ out.retireAge = age; break; }
  }

  const okMult = m => { const p = clone(s); p.investments.forEach(i => i.add = num(i.add)*m); return survives(p); };
  if (okMult(1)){
    /* already funded: find the SMALLEST multiple that still works, so the
       difference from 1 is the slack in what is being put away */
    if (okMult(0)) out.contribMult = 0;
    else {
      let lo = 0, hi = 1;
      for (let k = 0; k < 44; k++){ const mid = (lo+hi)/2; if (okMult(mid)) hi = mid; else lo = mid; }
      out.contribMult = hi;
    }
  } else if (okMult(20)){
    let lo = 1, hi = 20;
    for (let k = 0; k < 44; k++){ const mid = (lo+hi)/2; if (okMult(mid)) hi = mid; else lo = mid; }
    out.contribMult = hi;
  }

  const retGoal = s.goals.find(g => g.isRet && g.on);
  if (retGoal){
    const okAmt = v => { const p = clone(s); p.goals.forEach(g => { if (g.isRet) g.amt = v; }); return survives(p); };
    let lo = 0, hi = Math.max(num(retGoal.amt)*4, 1);
    if (okAmt(hi)) out.sustainable = hi;
    else { for (let k = 0; k < 44; k++){ const mid = (lo+hi)/2; if (okAmt(mid)) lo = mid; else hi = mid; } out.sustainable = lo; }
  }

  /* signed: positive is corpus you could take out today, negative is what
     would have to go in for the plan to hold */
  const corpus = s.investments.filter(i => i.on).reduce((t,i) => t + num(i.val), 0);
  const okLump = d => survives(withLump(s, d));
  if (okLump(0)){
    if (okLump(-corpus)) out.lumpToday = corpus;
    else {
      let lo = 0, hi = corpus;
      for (let k = 0; k < 40; k++){ const mid = (lo+hi)/2; if (okLump(-mid)) lo = mid; else hi = mid; }
      out.lumpToday = lo;
    }
  } else {
    const ceiling = corpus * 20 + 1e7;
    if (okLump(ceiling)){
      let lo = 0, hi = ceiling;
      for (let k = 0; k < 40; k++){ const mid = (lo+hi)/2; if (okLump(mid)) hi = mid; else lo = mid; }
      out.lumpToday = -hi;
    }
  }
  return out;
}

/* ---- src/engine/attribution.mjs ---- */
/* Drawn-from / tax attribution and the year-by-year export rows.
   Ported from yearsTab() and exportCsv() in the v37 planner page (_archive/v37_reference); the
   markup stays in ui/, the numbers and their order live here. */

/* Holdings are labelled by bare name, with the owner appended only when two
   enabled holdings share a name. */
function holdLabeller(state){
  const seen = {};
  state.investments.filter(i => i.on).forEach(i => seen[i.name] = (seen[i.name] || 0) + 1);
  return i => (seen[i.name] > 1 && i.owner) ? i.name + " (" + i.owner + ")" : i.name;
}

/* Every holding that either gave money or paid tax this year. A holding taxed
   as it accrues pays on its growth even in a year nothing is taken from it. */
function drawnFrom(state, y, holdLabel){
  const label = holdLabel || holdLabeller(state);
  return state.investments
    .filter(i => {
      const b = i.on && y.byInv[i.id]; if (!b) return false;
      return b.withdrawal > 1 || (num(b.taxYear) + num(b.taxDraw)) > 1;
    })
    .map(i => {
      const b = y.byInv[i.id];
      return {id: i.id, name: label(i), amt: num(b.withdrawal), tax: num(b.taxYear) + num(b.taxDraw)};
    })
    .sort((a,b) => (b.amt - a.amt) || (b.tax - a.tax));
}

const CSV_HEADER = ["Year","Age","Phase","Opening","Invested","Growth","Goal spending",
  "Living costs","Tax","Total out","Unfunded","Closing","Needed by year end","Surplus or short",
  "Drawn from","Tax by holding","Events"];

/* rq is the END-of-year required curve (reqEndFor), or null. */
function yearRows(state, years, rq){
  const rows = [CSV_HEADER.slice()];
  years.forEach((y, yi) => rows.push([
    y.year, y.age, y.phase, Math.round(y.opening), Math.round(y.contribution), Math.round(y.growth),
    Math.round(y.goalSpend), Math.round(y.retSpend), Math.round(y.tax), Math.round(y.outflow), Math.round(y.shortfall),
    Math.round(y.closing),
    rq && rq[yi] != null ? Math.round(rq[yi]) : "",
    rq && rq[yi] != null ? Math.round(y.closing - rq[yi]) : "",
    state.investments.filter(i => i.on && y.byInv[i.id] && y.byInv[i.id].withdrawal > 1)
      .sort((a,b) => y.byInv[b.id].withdrawal - y.byInv[a.id].withdrawal)
      .map(i => i.name + (i.owner ? " (" + i.owner + ")" : "") + ": " + Math.round(y.byInv[i.id].withdrawal))
      .join("; "),
    state.investments.filter(i => i.on && y.byInv[i.id] && (num(y.byInv[i.id].taxYear) + num(y.byInv[i.id].taxDraw)) > 1)
      .map(i => i.name + (i.owner ? " (" + i.owner + ")" : "") + ": "
              + Math.round(num(y.byInv[i.id].taxYear) + num(y.byInv[i.id].taxDraw)))
      .join("; "),
    y.goals.map(g => g.name + (g.short > 1 ? " (short " + Math.round(g.short) + ")" : "")).join("; ")
  ]));
  return rows;
}

function toCsv(rows){
  return rows.map(r => r.map(c => {
    const s = String(c);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(",")).join("\n");
}

/* ---- src/ui/format.js ---- */
/* Lifted from the v37 planner page (_archive/v37_reference) on 2026-09-19; edited since. */
const IN = new Intl.NumberFormat("en-IN", {maximumFractionDigits:0});
function inr(n){ const s = IN.format(Math.round(Math.abs(n))); return (n<0?"−₹":"₹")+s; }
function short(n){
  const a = Math.abs(n), sg = n<0?"−":"";
  if (a >= 1e7) return sg+"₹"+(a/1e7).toFixed(a/1e7>=100?0:2)+" cr";
  if (a >= 1e5) return sg+"₹"+(a/1e5).toFixed(a/1e5>=100?0:1)+" L";
  if (a >= 1000) return sg+"₹"+IN.format(Math.round(a));
  return sg+"₹"+Math.round(a);
}
function pct(x, d){ return (x*100).toFixed(d===undefined?1:d)+"%"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dateLong(v){
  const p = String(v).split("-");
  return Number(p[2]) + " " + MONTHS[Number(p[1])-1] + " " + p[0];
}
function dateShort(v){
  const p = String(v).split("-");
  return Number(p[2]) + " " + MON3[Number(p[1])-1] + " " + p[0];
}
function asOfLabel(s){ return dateLong(normDate(s.a.asOf)); }

/* ---- src/storage/files.js ---- */
/* ============================================================== storage
   The file is the plan. The page keeps it in memory and in a file, nowhere
   else: no localStorage, no IndexedDB, no draft, no silent restore. The only
   two moments anything moves are Load and Save.

   What the browser supports decides how Save works:

     Chrome / Edge (File System Access)
                               1. folder picker → writes goal_plan.json there
                                  and keeps the copy it replaced as
                                  backups/goal_plan_<stamp>.json (last 10)
                               2. if the browser refuses a folder: "Save as…"
                                  picker; the replaced copy is downloaded
     Safari / Firefox          download goal_plan.json

   Load is the same everywhere: an ordinary file input, .json or legacy .js.

   Chrome remembers the last folder per picker `id` by itself, so the page
   stores nothing to make the second Save land in the same place.          */

const PLAN_FILE = "goal_plan.json";
const BACKUP_DIR = "backups";
const KEEP_BACKUPS = 10;
const PICKER_ID = "goal_planner";

/* Hands a file to the user as a normal browser download. */
function offerDownload(filename, text, mime){
  return Promise.resolve(linkDownload(filename, text, mime)
    ? {ok:true, how:"link"} : {ok:false, error:"Could not start the download."});
}

function linkDownload(filename, text, mime){
  try {
    const url = URL.createObjectURL(new Blob([text], {type:(mime || "application/json") + ";charset=utf-8"}));
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch(e){ return false; }
}

function saveMode(){
  if (typeof window.showDirectoryPicker === "function") return "folder";
  if (typeof window.showSaveFilePicker === "function") return "file";
  return "download";
}

const isAbort = e => e && (e.name === "AbortError");

/* ------------------------------------------------------------ load */
/* Resolves {ok, loaded, name, kind} or {ok:false, error}. Nothing is adopted
   here: the caller checks it and decides. */
function readPlanFile(file){
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onerror = () => resolve({ok:false, error:"Could not read that file."});
    fr.onload = () => {
      let loaded;
      try { loaded = parsePlanText(fr.result); }
      catch(e){ resolve({ok:false, error:`${file.name} is not a plan file (it is not valid JSON).`}); return; }
      if (!looksLikePlan(loaded)){ resolve({ok:false, error:`${file.name} does not look like a plan — no holdings or goals in it.`}); return; }
      resolve({ok:true, loaded, text: fr.result, name:file.name, kind: /\.json$/i.test(file.name) ? "json" : "js"});
    };
    fr.readAsText(file);
  });
}

/* ------------------------------------------------------------ save */
async function readText(fileHandle){
  try { const f = await fileHandle.getFile(); return f.size ? await f.text() : ""; }
  catch(e){ return ""; }
}
async function writeText(fileHandle, text){
  const w = await fileHandle.createWritable();
  await w.write(text);
  await w.close();
}

/* one line describing a plan file's contents, for the replace question */
function describePlanText(text){
  try {
    const p = parsePlanText(text);
    const on = (p.investments || []).filter(i => i.on !== false);
    const tot = on.reduce((t,i) => t + num(i.val), 0);
    return `${on.length} holding${on.length === 1 ? "" : "s"}, ${(p.goals || []).length} goals, ${short(tot)}`
      + (p.savedAt ? `, saved ${new Date(p.savedAt).toLocaleString("en-IN", {dateStyle:"medium", timeStyle:"short"})}` : "");
  } catch(e){ return "not readable as a plan"; }
}

async function exists(dir, name){
  try { await dir.getFileHandle(name); return true; } catch(e){ return false; }
}

/* Keep the newest KEEP_BACKUPS timestamped files; never touch anything else. */
async function pruneBackups(dir){
  const names = [];
  for await (const [name, h] of dir.entries())
    if (h.kind === "file" && /^goal_plan_\d{8}-\d{6}(-\d+)?\.json$/.test(name)) names.push(name);
  names.sort();
  const drop = names.slice(0, Math.max(0, names.length - KEEP_BACKUPS));
  for (const n of drop){ try { await dir.removeEntry(n); } catch(e){ /* leave it */ } }
  return drop.length;
}

/* opts.confirmReplace(where, summary) → Promise<boolean>. Asked only when the
   file about to be replaced is not the one this plan came from — judged by
   content (opts.isKnown), since a file input never reveals its folder. */
async function savePlanText(text, opts){
  const mode = saveMode();
  const stamp = backupName(new Date());

  if (mode === "folder"){
    let dir;
    try { dir = await window.showDirectoryPicker({id: PICKER_ID, mode: "readwrite", startIn: "documents"}); }
    catch(e){
      if (isAbort(e)) return {ok:false, cancelled:true};
      /* SecurityError/NotAllowedError: this page may not use a folder here.
         Fall through to the single-file route rather than give up. */
      return savePlanFile(text, opts, stamp, "Chrome would not let this page use a folder, so it saved a single file instead.");
    }
    let target, existing = "";
    try { target = await dir.getFileHandle(PLAN_FILE); existing = await readText(target); }
    catch(e){ target = null; }
    if (existing && opts && opts.confirmReplace && !opts.isKnown(existing)){
      const go = await opts.confirmReplace(`${dir.name}/${PLAN_FILE}`, describePlanText(existing));
      if (!go) return {ok:false, cancelled:true};
    }
    let backup = null, pruned = 0;
    if (existing && existing.trim() !== text.trim()){
      const bdir = await dir.getDirectoryHandle(BACKUP_DIR, {create: true});
      /* two saves inside one second must not overwrite each other's backup */
      let name = stamp;
      for (let k = 1; await exists(bdir, name); k++) name = stamp.replace(/\.json$/, `-${k}.json`);
      const bh = await bdir.getFileHandle(name, {create: true});
      await writeText(bh, existing);
      backup = `${BACKUP_DIR}/${name}`;
      pruned = await pruneBackups(bdir);
    }
    if (!target) target = await dir.getFileHandle(PLAN_FILE, {create: true});
    await writeText(target, text);
    return {ok:true, where: `${dir.name}/${PLAN_FILE}`, source: dir.name, backup, pruned, mode};
  }

  if (mode === "file") return savePlanFile(text, opts, stamp, null);

  const r = await offerDownload(PLAN_FILE, text, "application/json");
  if (!r.ok) return r.declined ? {ok:false, cancelled:true} : {ok:false, error:r.error};
  return {ok:true, where: `${PLAN_FILE} (downloaded)`, source: null, backup: null, mode};
}

async function savePlanFile(text, opts, stamp, note){
  let fh;
  try {
    fh = await window.showSaveFilePicker({id: PICKER_ID, suggestedName: PLAN_FILE, startIn: "documents",
      types: [{description: "Goal plan", accept: {"application/json": [".json"]}}]});
  } catch(e){
    if (isAbort(e)) return {ok:false, cancelled:true};
    const r = await offerDownload(PLAN_FILE, text, "application/json");
    return r.ok ? {ok:true, where:`${PLAN_FILE} (downloaded)`, source:null, backup:null, mode:"download",
                   note:"This browser would not open a save dialog here, so the plan was downloaded."}
                : {ok:false, error:r.error || "Could not save."};
  }
  const existing = await readText(fh);
  if (existing && opts && opts.confirmReplace && !opts.isKnown(existing)){
    const go = await opts.confirmReplace(fh.name, describePlanText(existing));
    if (!go) return {ok:false, cancelled:true};
  }
  let backup = null;
  if (existing && existing.trim() !== text.trim()){
    /* A file grant does not reach the file's neighbours, so the replaced copy
       cannot go beside it. Say where it really went. */
    const r = await offerDownload(stamp, existing, "application/json");
    if (r.ok) backup = `${stamp} in your Downloads folder`;
  }
  await writeText(fh, text);
  return {ok:true, where: fh.name, source: fh.name, backup, mode:"file", note};
}

/* ---- src/ui/charts.js ---- */
/* Lifted from the v37 planner page (_archive/v37_reference) on 2026-09-19; edited since. */
/* ================================================================ charts */
const CW = 1000, PAD = {l:66, r:20, t:16, b:34};

function svgEl(w,h,inner){
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img">${inner}</svg>`;
}
function niceTicks(min, max, count){
  const span = (max - min) || 1;
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.abs(raw))));
  const norm = raw / mag;
  const step = (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1) * mag;
  const out = []; let v = Math.ceil(min/step)*step;
  while (v <= max + step*0.01){ out.push(v); v += step; }
  return out;
}

/* ---- corpus trajectory: recorded history, then projection --------------- */
function corpusChart(){
  const {years, m} = MODEL.proj, H = 350;
  const hist = state.history.slice().sort((a,b)=>a.year-b.year)
    .filter(r => r.year <= state.a.currentYear);
  const x0 = Math.min(hist.length ? hist[0].year : state.a.currentYear, state.a.currentYear);
  const x1 = m.endYear;
  const pts = years.map(y => ({year:y.year, v:y.closing}));
  const req = reqEndFor(years, reqCurve);
  const all = pts.map(p=>p.v).concat(hist.map(r=>num(r.actual))).concat([0])
    .concat(req ? req.filter(v => v != null) : []);
  const vmax = Math.max.apply(null, all), vmin = Math.min(0, Math.min.apply(null, all));
  const ticks = niceTicks(vmin, vmax, 5);
  const top = Math.max(vmax, ticks[ticks.length-1]);

  const X = yr => PAD.l + (yr - x0) / Math.max(x1 - x0, 1) * (CW - PAD.l - PAD.r);
  const Y = v  => PAD.t + (1 - (v - vmin) / Math.max(top - vmin, 1)) * (H - PAD.t - PAD.b);

  /* The band between what is projected and what is needed, clipped twice:
     green where the projection sits above the requirement, red where below.
     Clipping at the requirement line makes the crossings exact. */
  /* Drawn per unbroken run of years: a year the search could not price (it
     returns null) breaks the line there instead of hiding all of it. */
  let band = "";
  if (req){
    const runs = []; let cur = [];
    years.forEach((y,i) => { if (req[i] != null) cur.push(i); else { if (cur.length) runs.push(cur); cur = []; } });
    if (cur.length) runs.push(cur);
    const yTop = PAD.t.toFixed(1), yBot = (H - PAD.b).toFixed(1);
    runs.forEach((run, r) => {
      const aPts = run.map(i => `${X(years[i].year).toFixed(1)},${Y(years[i].closing).toFixed(1)}`);
      const rPts = run.map(i => `${X(years[i].year).toFixed(1)},${Y(req[i]).toFixed(1)}`);
      if (run.length > 1){
        const region = `M${aPts.join("L")}L${rPts.slice().reverse().join("L")}Z`;
        const x0p = X(years[run[0]].year).toFixed(1), x1p = X(years[run[run.length-1]].year).toFixed(1);
        band += `<defs>
          <clipPath id="reqAbove${r}"><polygon points="${rPts.join(" ")} ${x1p},${yTop} ${x0p},${yTop}"/></clipPath>
          <clipPath id="reqBelow${r}"><polygon points="${rPts.join(" ")} ${x1p},${yBot} ${x0p},${yBot}"/></clipPath>
        </defs>
        <g clip-path="url(#reqAbove${r})"><path d="${region}" fill="var(--good)" opacity="0.16"/></g>
        <g clip-path="url(#reqBelow${r})"><path d="${region}" fill="var(--critical)" opacity="0.16"/></g>`;
      }
      band += run.length > 1
        ? `<path d="M${rPts.join("L")}" fill="none" stroke="var(--c-need)" stroke-width="2.25" stroke-dasharray="7 5" stroke-linejoin="round"/>`
        : `<circle cx="${rPts[0].split(",")[0]}" cy="${rPts[0].split(",")[1]}" r="3" fill="var(--c-need)"/>`;
    });
  }

  let g = "";
  ticks.forEach(t => {
    g += `<line x1="${PAD.l}" y1="${Y(t).toFixed(1)}" x2="${CW-PAD.r}" y2="${Y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${PAD.l-9}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${short(t)}</text>`;
  });

  const step = (x1 - x0) > 30 ? 5 : ((x1-x0) > 14 ? 2 : 1);
  for (let yr = Math.ceil(x0/step)*step; yr <= x1; yr += step){
    g += `<text x="${X(yr).toFixed(1)}" y="${H-13}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${yr}</text>`;
  }

  const area = "M" + pts.map(p => `${X(p.year).toFixed(1)},${Y(p.v).toFixed(1)}`).join("L")
    + `L${X(pts[pts.length-1].year).toFixed(1)},${Y(Math.max(vmin,0)).toFixed(1)}L${X(pts[0].year).toFixed(1)},${Y(Math.max(vmin,0)).toFixed(1)}Z`;
  const line = "M" + pts.map(p => `${X(p.year).toFixed(1)},${Y(p.v).toFixed(1)}`).join("L");

  // Marker labels sit on a backing chip so they stay readable wherever the
  // curve happens to run.
  let marks = "";
  const mark = (yr, color, label) => {
    if (yr < x0 || yr > x1) return "";
    const xx = X(yr), right = yr > (x0 + x1) / 2;
    const w = label.length * 6.2 + 12;
    const bx = right ? xx - 5 - w : xx + 5;
    return `<line x1="${xx.toFixed(1)}" y1="${PAD.t}" x2="${xx.toFixed(1)}" y2="${H-PAD.b}" stroke="${color}" stroke-width="1.5" stroke-dasharray="4 4"/>`
      + `<rect x="${bx.toFixed(1)}" y="${PAD.t+1}" width="${w.toFixed(1)}" height="16" rx="4" fill="var(--surface)" opacity="0.9"/>`
      + `<text x="${(bx+w/2).toFixed(1)}" y="${PAD.t+12.5}" text-anchor="middle" font-size="11" font-weight="600" fill="${color}">${esc(label)}</text>`;
  };
  marks += mark(m.retirementYear, "var(--c-ret)", "Retire · " + m.retirementYear);
  /* the red marker is the first year the goals are not met — not the year the
     corpus hits zero, which a locked holding can push years later */
  const firstShort = years.find(y => y.shortfall > 1);
  if (firstShort) marks += mark(firstShort.year, "var(--critical)", "Runs short · " + firstShort.year);

  // One-time goals: a tick on the baseline, label ABOVE it so it never
  // collides with the year axis; close labels alternate into a second lane.
  let ev = "";
  const evs = state.goals
    .filter(g2 => g2.on && !g2.isRet && g2.kind === "onetime" && g2.start >= x0 && g2.start <= x1)
    .sort((p,q) => p.start - q.start);
  let lastX = -1e9, lane = 0;
  evs.forEach(g2 => {
    const xx = X(g2.start), yy = Y(0);
    lane = (xx - lastX < 116) ? (lane + 1) % 2 : 0;
    lastX = xx;
    const name = g2.name.length > 17 ? g2.name.slice(0,16) + "…" : g2.name;
    const near = CW - PAD.r - 70;
    const anchor = xx < PAD.l + 62 ? "start" : (xx > near ? "end" : "middle");
    ev += `<line x1="${xx.toFixed(1)}" y1="${(yy-6).toFixed(1)}" x2="${xx.toFixed(1)}" y2="${(yy+6).toFixed(1)}" stroke="var(--c-goal)" stroke-width="2.5"/>`;
    ev += `<text x="${xx.toFixed(1)}" y="${(yy - 12 - lane*13).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" fill="var(--c-goal)">${esc(name)}</text>`;
  });

  let histPath = "";
  if (hist.length > 1){
    histPath = `<path d="M${hist.map(r => `${X(r.year).toFixed(1)},${Y(num(r.actual)).toFixed(1)}`).join("L")}" fill="none" stroke="var(--c-rec)" stroke-width="2.75" stroke-linejoin="round"/>`;
    hist.forEach(r => { histPath += `<circle cx="${X(r.year).toFixed(1)}" cy="${Y(num(r.actual)).toFixed(1)}" r="3.5" fill="var(--ink-2)"/>`; });
  }

  const todayX = X(state.a.currentYear).toFixed(1);
  const zeroY = Y(0).toFixed(1);

  const inner = `
    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--c-proj)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="var(--c-proj)" stop-opacity="0.02"/>
    </linearGradient></defs>
    ${g}
    <line x1="${PAD.l}" y1="${zeroY}" x2="${CW-PAD.r}" y2="${zeroY}" stroke="var(--axis)" stroke-width="1.5"/>
    <path d="${area}" fill="url(#cg)"/>
    ${band}
    ${marks}
    <path d="${line}" fill="none" stroke="var(--c-proj)" stroke-width="2.75" stroke-linejoin="round"/>
    ${histPath}
    ${ev}
    <line x1="${todayX}" y1="${PAD.t}" x2="${todayX}" y2="${H-PAD.b}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="2 3" opacity="0.55"/>
    <g id="cx" style="opacity:0">
      <line y1="${PAD.t}" y2="${H-PAD.b}" stroke="var(--ink-2)" stroke-width="1"/>
      <circle r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    </g>
    <rect id="chit" x="${PAD.l}" y="${PAD.t}" width="${CW-PAD.l-PAD.r}" height="${H-PAD.t-PAD.b}" fill="transparent"/>`;

  return {svg: svgEl(CW, H, inner), X, Y, pts, x0, x1, H};
}

/* ---- money in / money out: inflows above the line, outflows below ------- */
function flowChart(){
  const years = MODEL.proj.years, H = 320;
  const up = years.map(y => y.contribution + y.growth);
  /* what should have gone out but could not is drawn too, as an empty dashed
     bar: without it a year with nothing left to pay from looks like a year
     with nothing to pay */
  const dn = years.map(y => y.outflow + (y.shortfall > 1 ? y.shortfall : 0));
  const vmax = Math.max(1, Math.max.apply(null, up));
  const vmin = -Math.max(1, Math.max.apply(null, dn));
  const ticks = niceTicks(vmin, vmax, 6);
  const lo = Math.min(vmin, ticks[0]), hi = Math.max(vmax, ticks[ticks.length-1]);
  const X = i => PAD.l + (i + 0.5) / years.length * (CW - PAD.l - PAD.r);
  const Y = v => PAD.t + (1 - (v - lo) / Math.max(hi - lo, 1)) * (H - PAD.t - PAD.b);
  const bw = Math.max(4, (CW - PAD.l - PAD.r) / years.length - 4);

  let g = "";
  ticks.forEach(t => {
    g += `<line x1="${PAD.l}" y1="${Y(t).toFixed(1)}" x2="${CW-PAD.r}" y2="${Y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    // signed ticks: positive above the line is money in, negative below is money out
    g += `<text x="${PAD.l-9}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${t===0?"₹0":short(t)}</text>`;
  });

  // 2px surface gap BETWEEN stacked segments; the segment touching the
  // baseline stays anchored to it.
  let bars = "";
  years.forEach((y,i) => {
    const cx = X(i) - bw/2;
    let acc = 0, first = true;
    [["contribution","var(--s1)"],["growth","var(--s2)"]].forEach(([k,c]) => {
      const v = y[k]; if (v <= 0) return;
      const yTop = Y(acc + v), yBot = Y(acc);
      const gap = first ? 0 : 2;
      const h = Math.max(yBot - yTop - gap, 0.8);
      bars += `<rect x="${cx.toFixed(1)}" y="${yTop.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${c}" rx="2"/>`;
      acc += v; first = false;
    });
    acc = 0; first = true;
    [["goalSpend","var(--s3)"],["retSpend","var(--s4)"],["tax","var(--s5)"]].forEach(([k,c]) => {
      const v = y[k]; if (v <= 0) return;
      const yTop = Y(-acc), yBot = Y(-(acc + v));
      const gap = first ? 0 : 2;
      const h = Math.max(yBot - yTop - gap, 0.8);
      bars += `<rect x="${cx.toFixed(1)}" y="${(yTop + gap).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${c}" rx="2"/>`;
      acc += v; first = false;
    });
    if (y.shortfall > 1){
      const yTop = Y(-acc), yBot = Y(-(acc + y.shortfall));
      const gap = first ? 0 : 2;
      const h = Math.max(yBot - yTop - gap - 1, 0.8);
      bars += `<rect x="${(cx + 0.75).toFixed(1)}" y="${(yTop + gap + 0.5).toFixed(1)}" width="${(bw - 1.5).toFixed(1)}" height="${h.toFixed(1)}" fill="var(--crit-wash)" stroke="var(--critical)" stroke-width="1.25" stroke-dasharray="3 2" rx="2"/>`;
    }
  });

  const step = years.length > 30 ? 5 : 2;
  let xl = "";
  years.forEach((y,i) => {
    if (y.year % step === 0)
      xl += `<text x="${X(i).toFixed(1)}" y="${H-13}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${y.year}</text>`;
  });

  const rx = X(years.findIndex(y => y.year === MODEL.proj.m.retirementYear));
  const retLine = rx > 0 ? `<line x1="${(rx-bw/2-2).toFixed(1)}" y1="${PAD.t}" x2="${(rx-bw/2-2).toFixed(1)}" y2="${H-PAD.b}" stroke="var(--s4)" stroke-width="1.5" stroke-dasharray="4 4"/>` : "";

  const inner = `${g}${retLine}${bars}
    <line x1="${PAD.l}" y1="${Y(0).toFixed(1)}" x2="${CW-PAD.r}" y2="${Y(0).toFixed(1)}" stroke="var(--axis)" stroke-width="1.5"/>
    ${xl}
    <rect id="fhit" x="${PAD.l}" y="${PAD.t}" width="${CW-PAD.l-PAD.r}" height="${H-PAD.t-PAD.b}" fill="transparent"/>`;
  return {svg: svgEl(CW, H, inner), X, years, H};
}

/* ---- history: what actually happened vs what the plan assumed ---------- */
function histChart(){
  const t = MODEL.trk; if (!t.enough && !t.sketch) return null;
  const H = 260, rows = t.rows;
  const vals = rows.map(r => num(r.actual)).concat(rows.filter(r => r.planned != null).map(r => r.planned));
  const vmax = Math.max.apply(null, vals), vmin = Math.min.apply(null, vals);
  const pad = (vmax - vmin) * 0.15 || vmax * 0.1 || 1;
  const lo = Math.max(0, vmin - pad), hi = vmax + pad;
  const ticks = niceTicks(lo, hi, 4);
  const X = i => PAD.l + (rows.length === 1 ? 0.5 : i/(rows.length-1)) * (CW - PAD.l - PAD.r);
  const Y = v => PAD.t + (1 - (v - lo)/Math.max(hi - lo, 1)) * (H - PAD.t - PAD.b);
  let g = "";
  ticks.forEach(v => {
    g += `<line x1="${PAD.l}" y1="${Y(v).toFixed(1)}" x2="${CW-PAD.r}" y2="${Y(v).toFixed(1)}" stroke="var(--grid)"/>`;
    g += `<text x="${PAD.l-9}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${short(v)}</text>`;
  });
  rows.forEach((r,i) => {
    g += `<text x="${X(i).toFixed(1)}" y="${H-13}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${r.year}</text>`;
  });
  const pth = (key, color, dash) => {
    /* an estimated year is not a reading: the solid line joins recorded values only */
    const pts = rows.map((r,i) => ((key === "actual" && !r.estimated) || (key !== "actual" && r.planned != null))
      ? `${X(i).toFixed(1)},${Y(key === "actual" ? num(r.actual) : r.planned).toFixed(1)}` : null).filter(Boolean);
    return pts.length < 2 ? "" :
      `<path d="M${pts.join("L")}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"${dash?` stroke-dasharray="${dash}"`:""}/>`;
  };
  let dots = "";
  /* the estimate joins the record with a dashed line and a hollow, dashed ring */
  rows.forEach((r,i) => {
    if (!r.estimated || i + 1 >= rows.length) return;
    dots += `<path d="M${X(i).toFixed(1)},${Y(num(r.actual)).toFixed(1)}L${X(i+1).toFixed(1)},${Y(num(rows[i+1].actual)).toFixed(1)}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-dasharray="3 4"/>`;
  });
  rows.forEach((r,i) => {
    if (r.estimated){
      dots += `<circle cx="${X(i).toFixed(1)}" cy="${Y(num(r.actual)).toFixed(1)}" r="5" fill="var(--surface)" stroke="var(--s1)" stroke-width="2" stroke-dasharray="2.5 2"/>`
        + `<text x="${X(i).toFixed(1)}" y="${(Y(num(r.actual))+20).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="var(--muted)">estimate</text>`;
      return;
    }
    /* the year still running is drawn hollow — it is a reading, not a result */
    dots += r.inProgress
      ? `<circle cx="${X(i).toFixed(1)}" cy="${Y(num(r.actual)).toFixed(1)}" r="4" fill="var(--surface)" stroke="var(--s1)" stroke-width="2.5"/>`
      : `<circle cx="${X(i).toFixed(1)}" cy="${Y(num(r.actual)).toFixed(1)}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`;
    if (r.planned != null)
      dots += `<circle cx="${X(i).toFixed(1)}" cy="${Y(r.planned).toFixed(1)}" r="3.5" fill="var(--muted)" stroke="var(--surface)" stroke-width="2"/>`;
  });
  const last = rows[rows.length-1];
  const lbl = `<text x="${(X(rows.length-1)-6).toFixed(1)}" y="${(Y(num(last.actual))-12).toFixed(1)}" text-anchor="end" font-size="11.5" font-weight="600" fill="var(--s1)">${short(num(last.actual))}</text>`;
  return svgEl(CW, H, g + pth("planned","var(--muted)","5 4") + pth("actual","var(--s1)") + dots + lbl);
}

/* Lifted from the v37 planner page (_archive/v37_reference) on 2026-09-19; edited since. */
/* ================================================================ render */
/* The first year the goals are not met in full. This, not the year the corpus
   reaches zero, is when the money "runs short": a holding locked until later
   (NPS, say) can keep the corpus above zero for years while nothing can be
   paid out of it. */
function shortFrom(){
  const y = MODEL.proj.years.find(r => r.shortfall > 1);
  return y ? {year: y.year, age: y.age} : null;
}
/* money sitting in holdings that are still locked at the end of a year */
function lockedAt(year){
  const y = MODEL.proj.years.find(r => r.year === year);
  if (!y) return {total: 0, names: [], until: null};
  const hs = state.investments.filter(i => i.on && i.avail != null && num(i.avail) > year
    && y.byInv[i.id] && y.byInv[i.id].closing > 1);
  return {total: hs.reduce((t,i) => t + y.byInv[i.id].closing, 0), names: hs.map(i => i.name),
          until: hs.length ? Math.min.apply(null, hs.map(i => num(i.avail))) : null};
}

function verdict(){
  const m = MODEL.proj.m, sf = shortFrom();
  const el = document.getElementById("verdictPill");
  if (m.allFunded){
    el.innerHTML = `<span class="verdict-pill pill-ok"><span class="dot"></span>Every goal funded to age ${state.a.lifeExpectancy}</span>`;
  } else if (sf){
    el.innerHTML = `<span class="verdict-pill pill-bad"><span class="dot"></span>Money runs short at age ${sf.age} &middot; ${sf.year}</span>`;
  } else {
    el.innerHTML = `<span class="verdict-pill pill-bad"><span class="dot"></span>${short(m.totalShortfall)} of goals unfunded</span>`;
  }
}

function tiles(){
  const m = MODEL.proj.m;
  const sf = m.allFunded ? null : shortFrom();
  const runsTo = sf ? `age ${sf.age}` : `age ${state.a.lifeExpectancy}+`;
  return `<div class="tiles">
    <div class="tile"><div class="k">Corpus today</div><div class="v">${short(m.currentCorpus)}</div>
      <div class="m">${m.embeddedTaxNow > 0
        ? short(m.afterTaxNow) + " after the tax owed on gains"
        : inr(m.annualContribution) + " added each year"}</div></div>
    <div class="tile"><div class="k">At retirement &middot; ${m.retirementYear}</div><div class="v">${short(m.corpusAtRetirement)}</div>
      <div class="m">needs ${short(m.requiredAtRetirement)} for all goals</div></div>
    <div class="tile"><div class="k">Peak corpus</div><div class="v">${short(m.peakCorpus)}</div>
      <div class="m">in ${m.peakYear}</div></div>
    <div class="tile"><div class="k">${sf ? "Money runs short at" : "Money lasts to"}</div><div class="v ${sf?"bad":"good"}">${runsTo}</div>
      <div class="m">${sf ? short(m.totalShortfall)+" of spending unmet" : "with "+short(m.finalCorpus)+" left over"}</div></div>
  </div>`;
}

function banner(){
  const m = MODEL.proj.m;
  if (m.allFunded){
    return `<div class="banner ok"><div class="icon">✓</div><div>
      <h2>The plan holds all the way to age ${state.a.lifeExpectancy}</h2>
      <p>Every goal is paid in full and ${short(m.finalCorpus)} is still left at the end. Retirement at ${state.a.retirementAge} works on these assumptions.</p>
    </div></div>`;
  }
  const worst = MODEL.proj.goalStatus.filter(g => g.status !== "Funded" && g.status !== "Not scheduled");
  const names = worst.map(g => g.name).join(", ");
  const sf = shortFrom();
  const lk = sf ? lockedAt(sf.year) : {total: 0};
  const lockNote = lk.total > 1
    ? ` ${short(lk.total)} is still there that year, but it is locked in ${esc(lk.names.join(", "))} until ${lk.until}.` : "";
  return `<div class="banner"><div class="icon">⚠</div><div>
    <h2>${sf ? `The money runs short at age ${sf.age}, in ${sf.year}` : "Some goals go unfunded"}</h2>
    <p>Retiring at ${state.a.retirementAge} leaves ${short(m.corpusAtRetirement)} against the ${short(m.requiredAtRetirement)} these goals actually need &mdash; a gap of ${short(Math.abs(m.surplus))}.
    ${names ? `Falls short on: <b>${esc(names)}</b>.` : ""} Total unmet spending over the plan: ${short(m.totalShortfall)}.${lockNote}</p>
  </div></div>`;
}

function fixes(){
  const f = MODEL.fix, m = MODEL.proj.m;
  const ok = m.allFunded;
  const now = m.annualContribution;
  const need = (f.contribMult != null) ? now * f.contribMult : null;
  const retGoal = state.goals.find(g => g.isRet && g.on);

  /* ---- the headline: one signed number, per year and per month --------- */
  let big, sub;
  if (need != null && now > 0){
    const diff = now - need;
    if (Math.abs(diff) < Math.max(now, 1) * 0.005){
      big = `<span>Invested to the rupee</span>`;
      sub = `What you put away each year is almost exactly what these goals need. There is no slack either way.`;
    } else if (diff > 0){
      big = `<span class="good">${short(diff)} a year spare</span>`;
      sub = need <= 0
        ? `You are investing ${inr(now)} a year &mdash; ${inr(now/12)} a month. On these assumptions every goal is
           met even if you stopped investing entirely tomorrow, so all of it is building margin.`
        : `You are investing ${inr(now)} a year. Every goal is met on ${inr(need)} &mdash; you are putting away about
           ${inr(diff/12)} a month more than the plan needs.`;
    } else {
      big = `<span class="bad">${short(-diff)} a year short</span>`;
      sub = `You are investing ${inr(now)} a year. These goals need ${inr(need)} &mdash; about
             ${inr(-diff/12)} a month more than you are putting away.`;
    }
  } else if (need != null && now <= 0){
    big = ok ? `<span class="good">Nothing more needed</span>` : `<span class="bad">${short(need)} a year needed</span>`;
    sub = ok ? `Every goal is met with no further investing at all.`
             : `You are investing nothing at present. These goals need ${inr(need)} a year.`;
  } else {
    big = `<span class="bad">Investing cannot close it</span>`;
    sub = `Even at twenty times the current amount the goals are not met in the
           ${m.retirementYear - state.a.currentYear} year${m.retirementYear-state.a.currentYear>1?"s":""}
           left to invest. Retiring later or spending less has to do the work.`;
  }

  /* ---- two bars: what goes in, against what the goals require ---------- */
  let bars = "";
  if (need != null && (now > 0 || need > 0)){
    const top = Math.max(now, need, 1);
    const row = (lbl, v, colour) => `<div class="barrow"><span class="lbl">${lbl}</span>
      <div class="track"><div class="fill" style="width:${Math.max(v/top*100, 1.5).toFixed(1)}%;background:${colour}"></div></div>
      <span class="val">${short(v)}</span></div>`;
    bars = `<div class="bars">
      ${row("You invest", now, "var(--s1)")}
      ${row("Goals need", need, need > now ? "var(--critical)" : "var(--good)")}
      <div class="barrow"><span class="lbl"></span>
        <span style="font-size:12px;color:var(--muted);grid-column:2 / span 2">a year, for the
        ${m.retirementYear - state.a.currentYear} year${m.retirementYear-state.a.currentYear>1?"s":""} of investing left</span></div>
    </div>`;
  }

  const stand = `<div class="stand"><div class="verdict"><div class="big">${big}</div>
    <span class="sub">${sub}</span></div>${bars}</div>`;

  /* ---- the four levers, each signed ------------------------------------ */
  const cards = [];

  if (f.lumpToday != null){
    const spare = f.lumpToday >= 0;
    /* the solver caps removal at the corpus, so equality means the whole lot
       is spare — the money going in from here carries the plan by itself */
    const wholeLot = spare && f.lumpToday >= m.currentCorpus - 1;
    cards.push(`<div class="fix"><div class="lever">Capital today</div>
      <div class="big ${spare?"good":"bad"}">${wholeLot ? "All of it" : short(Math.abs(f.lumpToday))}</div>
      <div class="from">${wholeLot ? `the whole ${short(m.currentCorpus)} is spare`
        : spare ? "could come out of the corpus now" : "would have to go in now"}</div>
      <p>${wholeLot
        ? `Even starting from nothing today, what you invest from here funds every goal to age ${state.a.lifeExpectancy}. Nothing in the corpus is committed.`
        : spare
        ? `Take that much out today, change nothing else, and every goal is still met to age ${state.a.lifeExpectancy}. It is the corpus that is not spoken for.`
        : `A one-off addition of this size fixes the plan on its own, with the same investing, the same retirement age and the same spending.`}</p></div>`);
  }

  if (f.retireAge != null && f.retireAge !== state.a.retirementAge){
    const d = f.retireAge - state.a.retirementAge, earlier = d < 0;
    cards.push(`<div class="fix"><div class="lever">${earlier ? "Stop earlier" : "Work longer"}</div>
      <div class="big ${earlier?"good":"bad"}">Retire at ${f.retireAge}</div>
      <div class="from">instead of ${state.a.retirementAge} &mdash; ${Math.abs(d)} year${Math.abs(d)>1?"s":""} ${earlier?"earlier":"later"}</div>
      <p>${earlier
        ? `The earliest age this corpus can carry every goal to ${state.a.lifeExpectancy}. Working past it builds cushion rather than covering a gap.`
        : `Contributions keep running and the corpus gets ${d} more year${d>1?"s":""} to compound before drawdown starts.`}</p></div>`);
  }

  if (need != null && now > 0){
    const less = need < now;
    cards.push(`<div class="fix"><div class="lever">${less ? "Invest less" : "Invest more"}</div>
      <div class="big ${less?"good":"bad"}">${short(need)}<span style="font-size:14px;color:var(--muted)">/yr</span></div>
      <div class="from">${inr(need/12)} a month, ${less?"down":"up"} from ${inr(now/12)}</div>
      <p>${less
        ? `The least that funds every goal while keeping retirement at ${state.a.retirementAge}. Anything above it is building margin.`
        : `Keeping retirement at ${state.a.retirementAge} works only if annual investing rises to this level for the next ${m.retirementYear - state.a.currentYear} year${m.retirementYear-state.a.currentYear>1?"s":""}.`}</p></div>`);
  }

  if (f.sustainable != null && retGoal){
    const cur = num(retGoal.amt), more = f.sustainable > cur;
    cards.push(`<div class="fix"><div class="lever">${more ? "Spend more" : "Spend less"}</div>
      <div class="big ${more?"good":"bad"}">${short(f.sustainable)}<span style="font-size:14px;color:var(--muted)">/yr</span></div>
      <div class="from">${inr(f.sustainable/12)} a month, ${more?"up":"down"} from ${inr(cur/12)} in today's money</div>
      <p>The largest retirement spend this corpus carries to age ${state.a.lifeExpectancy}, still paying every other goal in full.
      That is ${pct(Math.abs(f.sustainable/(cur||1) - 1))} ${more?"above":"below"} what you have planned.</p></div>`);
  }

  return stand + `<div class="fixgrid">${cards.join("")}</div>`;
}

function goalTable(){
  const gs = MODEL.proj.goalStatus;
  if (!gs.length) return `<div class="panel"><div class="empty">No goals yet. Add one on the Goals tab.</div></div>`;
  const cls = s => s === "Funded" ? "s-funded" : s === "Partial" ? "s-partial" : s === "Unfunded" ? "s-unfunded" : "s-none";
  const rows = gs.map(g => {
    const when = g.kind === "onetime" ? String(g.start) : `${g.start}–${g.end}`;
    const corpus = MODEL.proj.years.find(y => y.year === g.start);
    return `<tr>
      <td><b>${esc(g.name)}</b>${g.ess?"":' <span class="pillsm">optional</span>'}</td>
      <td><span class="pillsm">${g.kind === "onetime" ? "one-time" : "recurring"}</span></td>
      <td class="mono">${when}</td>
      <td class="mono r">${short(g.due)}</td>
      <td class="mono r">${short(g.paid)}</td>
      <td class="mono r" style="color:${g.short>1?"var(--critical)":"var(--muted)"}">${g.short > 1 ? short(g.short) : "—"}</td>
      <td class="mono r">${corpus ? short(corpus.opening) : "—"}</td>
      <td><span class="status ${cls(g.status)}"><span class="g"></span>${g.status}${g.firstShort?` from ${g.firstShort}`:""}</span></td>
    </tr>`;
  }).join("");
  return `<div class="panel"><div class="tblwrap"><table>
    <thead><tr><th>Goal</th><th>Type</th><th>When</th><th class="r">Cost then</th><th class="r">Funded</th><th class="r">Short by</th><th class="r">Corpus at start</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}

      <div class="sep"></div>
