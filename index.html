        <input class="money" type="text" inputmode="numeric" id="cgExempt" value="${IN.format(num(s.a.cgExempt))}" style="width:118px">
        </div>
    </div>

    <div class="panel panel-pad" style="margin-bottom:14px;font-size:13px;line-height:1.55;color:var(--ink-2)">
      <b style="color:var(--ink)">Withdraw order</b> decides where a goal's money comes from: <b>1</b> is sold first,
      then 2, then 3, and holdings sharing a number give equal amounts until one runs dry. A holding locked till a later
      year is skipped until then. As it stands: <b style="color:var(--ink)">${esc(orderText || "nothing included")}</b>.
      <br>
      <b style="color:var(--ink)">Tax category</b> says when the gain is taxed.
      <b>Every year</b> &mdash; bank interest, rent &mdash; pays as it accrues, so that tax never compounds, and nothing
      more is due when the money comes out. <b>On withdrawal</b> &mdash; equity, debt funds, NPS &mdash; pays nothing
      until you sell: a withdrawal takes principal and gain in the same proportion as the holding, and only the gain
      slice is taxed. That deferral is worth real money, which is why the two cannot share one rate.
      <b>Put in so far</b> is the principal; the rest of the value is gain. Withdrawals are grossed up, so a goal needing
      ${short(1000000)} pulls more than ${short(1000000)} out of the corpus. Set the rate to <b>0</b> for anything exempt,
      like EPF and PPF. The yearly exemption applies to withdrawal gains only.
      ${embedded > 0 ? `Right now ${short(embedded)} of the corpus is tax owed on gains you have not realised yet.` : ""}
      <span style="color:var(--muted)">Default rates follow Indian rules for FY 2025-26 and are a starting point, not tax advice.</span>
    </div>

    <div class="panel"><div class="tblwrap"><table>
      <thead><tr><th></th><th>Holding</th><th>Type</th><th>Owner</th>
        <th class="r">Value now</th><th class="r">Put in so far</th>
        <th class="r">Added / yr</th><th class="r">Step-up %</th><th class="r">Return %</th>
        <th>Tax category</th><th class="r">Tax %</th><th class="r">Withdraw order</th>
        <th class="r">Invest till</th><th class="r">Locked till</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="15" class="empty">No holdings yet.</td></tr>`}</tbody>
      <tfoot><tr><td></td><td>Total</td><td></td><td></td>
        <td class="mono r" data-live="ivTotal">${inr(tv)}</td>
        <td class="mono r" data-live="ivCost">${inr(tc)}</td>
        <td class="mono r" data-live="ivAdd">${inr(ta)}</td>
        <td colspan="7" class="mono r" data-live="ivRet">blended ${pct(MODEL.proj.m.blendedReturn,2)}</td></tr></tfoot>
    </table></div></div>
    <div class="rowactions"><button class="btn btn-accent" data-add="inv">+ Add holding</button>
      <span class="note" style="color:var(--muted);font-size:12.5px">&ldquo;Locked till&rdquo; keeps money like EPF out of reach until the year you set.</span></div>
  </section>`;
}

function goalsTab(){

    const one = g.kind === "onetime";

      <td><input type="checkbox" data-gl="on" ${g.on?"checked":""} aria-label="include"></td>

    <div class="panel"><div class="tblwrap"><table>

        <th class="r">Cost today</th><th class="r">Inflation %</th><th style="text-align:center">Must-have</th><th></th></tr></thead>

    </table></div></div>

    <div class="callout" style="margin-top:16px">Retirement spending is just a recurring goal &mdash; it starts the year you retire and runs to the end of the plan, so it competes for the same corpus as everything else. Its years follow the retirement age on the dashboard.</div>
  </section>`;

function histReadout(){
  const t = MODEL.trk;
  if (!t.enough && t.sketch){
    const e = state.history.find(h => h.estimated);
    return `<div class="callout estcallout" style="margin-bottom:18px"><b>Only one year is recorded, so there is nothing to compare yet.</b>
      ${e ? `${e.year} on the chart is an estimate, worked back from ${e.year + 1} using the plan's own ${pct(t.assumed,2)} return. Because it comes from the plan, it sits exactly on the plan by construction and says nothing about whether you are ahead or behind &mdash; it is there only to give the chart a slope.
      Type the real ${e.year} year-end value in the table below and the comparison becomes worth reading.` : ""}</div>`;
  }
  if (!t.enough){
    return `<div class="callout" style="margin-bottom:18px"><b>Add at least two years to see whether you are on track.</b>
      Record what the portfolio was actually worth at the end of each past year, and what you put in during that year.
      The tool then compares reality against what your assumed returns would have produced, and tells you the return you actually earned.</div>`;
  }
  const ahead = t.gap >= 0;
  return `<div class="tiles" style="margin-bottom:18px">
    <div class="tile"><div class="k">Return you actually earned</div>
      <div class="v ${ahead?"good":"bad"}">${pct(t.implied,2)}</div>
      <div class="m">over ${t.span} year${t.span>1?"s":""} of records</div></div>
    <div class="tile"><div class="k">Return the plan assumes</div><div class="v">${pct(t.assumed,2)}</div>
      <div class="m">weighted across your holdings</div></div>
    <div class="tile"><div class="k">${ahead?"Ahead of plan":"Behind plan"}</div>
      <div class="v ${ahead?"good":"bad"}">${(ahead?"+":"")+short(t.gap)}</div>
      <div class="m">${(ahead?"+":"")+pct(t.gapPct)} against where the plan says you'd be</div></div>
  </div>`;
}

function historyTab(){
  const t = MODEL.trk, liveY = asOfYear(state);
  const fmtGap = g => g == null ? "&mdash;" : (g >= 0 ? "+" : "") + short(g);

  const rows = state.history.slice().sort((a,b)=>num(a.year)-num(b.year)).map(h => {
    const r = t.rows.find(x => x.id === h.id) || {};
    const live = num(h.year) === liveY;
    const derivedC = h.snaps && h.snaps.length > 0;
    const gap = t.enough ? r.gap : null;

    const est = !!h.estimated;
    const yearCell = live
      ? `<td class="mono"><b>${h.year}</b> <span class="inprog">in progress</span></td>`
      : est
      ? `<td class="mono"><b>${h.year}</b> <span class="pillsm est">estimated</span></td>`
      : `<td><input class="w-yr" type="number" data-hs="year" value="${h.year}"></td>`;
    /* the running year is the holdings total, so it is shown, not typed */
    const actualCell = live
      ? `<td class="mono r derivedcell"><b>${inr(num(h.actual))}</b></td>`
      : `<td><input class="w-num money" type="text" inputmode="numeric" data-hs="actual" value="${IN.format(h.actual)}"></td>`;
    const contribCell = est
      ? `<td class="mono r derivedcell" title="The plan's annual investing, taken back a year">${inr(num(h.contribution))}</td>`
      : derivedC
      ? `<td class="mono r derivedcell" title="Added up from the snapshots below">${inr(num(h.contribution))}</td>`
      : `<td><input class="w-num money" type="text" inputmode="numeric" data-hs="contribution" value="${IN.format(h.contribution)}"></td>`;

    const main = `<tr data-id="${h.id}"${live?' class="live"':est?' class="estrow"':''}>
      ${yearCell}${actualCell}${contribCell}
      <td class="mono r" style="color:var(--muted)" data-planned="${h.id}">${r.planned != null ? short(r.planned) : "&mdash;"}</td>
      <td class="mono r" data-gap="${h.id}" style="color:${gap==null?"var(--muted)":(gap>=0?"var(--good)":"var(--critical)")}">${fmtGap(gap)}</td>
      <td>${est
        ? `<span class="estnote">${esc(h.note||"")} Type the real year-end value to replace it.</span>`
        : `<input type="text" data-hs="note" value="${esc(h.note||"")}" placeholder="${live?"still running":"what changed"}">`}</td>
      <td>${live?"":`<button class="icon-btn" data-del="hist" aria-label="Remove year ${h.year}">&#10005;</button>`}</td>
    </tr>`;

    const snaps = (h.snaps||[]).map((sn, k) => {
      const prev = k > 0 ? num(h.snaps[k-1].total) : null;
      const move = prev == null ? null : num(sn.total) - prev;
      return `<tr class="snap" data-hid="${h.id}" data-sid="${sn.id}">
        <td><div class="when"><span class="rail"></span>
          <input type="date" data-sn="date" value="${sn.date}" aria-label="Date of this reading"></div></td>
        <td class="mono r">${inr(num(sn.total))}</td>
        <td><input class="w-num money" type="text" inputmode="numeric" data-sn="added" value="${IN.format(num(sn.added))}" aria-label="Added since the previous reading"></td>
        <td class="mono r" style="color:var(--muted)">${move == null ? "&mdash;" : (move>=0?"+":"") + short(move)}</td>
        <td class="mono r" style="color:var(--muted)">${move == null ? "" : "since last"}</td>
        <td><input type="text" data-sn="note" value="${esc(sn.note||"")}" placeholder="what changed"></td>
        <td><button class="icon-btn" data-del="snap" aria-label="Remove the reading from ${dateShort(sn.date)}">&#10005;</button></td>
      </tr>`;
    }).join("");

    return main + snaps;
  }).join("");

  const chart = histChart();
  return `<section>
    <div class="sechead"><h2>Where you have actually got to</h2>
      <span class="note">The projection starts from today. This is the record behind it.</span></div>
    <div id="histReadout">${histReadout()}</div>
    <div class="panel panel-pad" style="margin-bottom:18px">
      <div class="legend"><span><i class="ln" style="background:var(--s1)"></i>What the portfolio was actually worth</span>
        <span><i class="ln" style="background:var(--muted)"></i>What the assumed return would have produced</span></div>
      <div class="chartbox" id="histChartBox">${chart || ""}</div></div>
    <div class="panel"><div class="tblwrap"><table>
      <thead><tr><th class="r">Year</th><th class="r">Corpus at year end</th><th class="r">Invested during the year</th>
        <th class="r">Plan would say<span class="infoicon" title="Your corpus if every past year had earned the plan's assumed return, given what you actually invested">ⓘ</span></th><th class="r">Difference<span class="infoicon" title="Actual corpus at year end minus &quot;Plan would say&quot;. Green = ahead of plan, red = behind plan">ⓘ</span></th><th>Note</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="7" class="empty">No records yet.</td></tr>`}</tbody>
    </table></div></div>
    <div class="rowactions"><button class="btn btn-accent" data-add="hist">+ Add an earlier year</button>
      <span class="note" style="color:var(--muted);font-size:12.5px">Indented rows are the readings you recorded during a
      year. ${liveY} is still running: its corpus follows the Portfolio tab, and it joins the comparison once the year ends.</span></div>
  </section>`;
}

function yearsTab(){
  const ys = MODEL.proj.years;
  const rqAll = reqEndFor(ys, reqCurve);
  /* label holdings the way the withdraw-order sentence does: bare name, with
     the owner appended only when two holdings share a name */
  const seen = {};
  state.investments.filter(i => i.on).forEach(i => seen[i.name] = (seen[i.name] || 0) + 1);
  const holdLabel = i => (seen[i.name] > 1 && i.owner) ? i.name + " (" + i.owner + ")" : i.name;
  /* Every holding that either gave money or paid tax this year. A holding
     taxed as it accrues pays on its growth even in a year nothing is taken
     out of it, so listing withdrawals alone would leave part of the Tax
     column unexplained. */
  const drawnFrom = y => state.investments
    .filter(i => {
      const b = i.on && y.byInv[i.id]; if (!b) return false;
      return b.withdrawal > 1 || (num(b.taxYear) + num(b.taxDraw)) > 1;
    })
    .map(i => {
      const b = y.byInv[i.id];
      return {name: holdLabel(i), amt: num(b.withdrawal), tax: num(b.taxYear) + num(b.taxDraw)};
    })
    .sort((a,b) => (b.amt - a.amt) || (b.tax - a.tax));
  const rows = ys.map((y, yi) => {
    const rq = rqAll ? rqAll[yi] : null;
    const notes = y.goals.map(g => g.short > 1
      ? `<span style="color:var(--critical)">${esc(g.name)} short ${short(g.short)}</span>`
      : esc(g.name)).join(", ");
    return `<tr class="${y.phase==="Retirement"?"retired":""}">
      <td class="mono">${y.year}</td><td class="mono">${y.age}</td>
      <td>${y.phase==="Retirement"?'<span class="pillsm">retired</span>':""}</td>
      <td class="mono r">${short(y.opening)}</td>
      <td class="mono r" style="color:${y.contribution?"var(--s1)":"var(--muted)"}">${y.contribution?short(y.contribution):"—"}</td>
      <td class="mono r" style="color:var(--s2)">${short(y.growth)}</td>
      <td class="mono r" style="color:${y.goalSpend?"var(--s3)":"var(--muted)"}">${y.goalSpend?short(y.goalSpend):"—"}</td>
      <td class="mono r" style="color:${y.retSpend?"var(--s4)":"var(--muted)"}">${y.retSpend?short(y.retSpend):"—"}</td>
      <td class="mono r" style="color:${y.tax?"var(--s5)":"var(--muted)"}">${y.tax?short(y.tax):"—"}</td>
      <td class="mono r"><b>${short(y.closing)}</b></td>
      ${rq == null ? `<td class="mono r" style="color:var(--muted)">&mdash;</td>`
        : `<td class="mono r" style="color:${y.closing-rq>=0?"var(--good)":"var(--critical)"}">${(y.closing-rq>=0?"+":"")+short(y.closing-rq)}</td>`}
      <td style="font-size:12px;color:var(--ink-2);min-width:190px">${(() => {
        const d = drawnFrom(y);
        return d.length ? d.map(x => `<span class="drawn"><b>${esc(x.name)}</b>${
            x.amt > 1 ? " " + short(x.amt) : ""}${
            x.tax > 1 ? `<em>${x.amt > 1 ? "tax " : "tax only "}${short(x.tax)}</em>` : ""}</span>`).join("")
          : `<span style="color:var(--muted)">&mdash;</span>`;
      })()}</td>
      <td style="font-size:12px;color:var(--ink-2)">${notes||""}</td>
    </tr>`;
  }).join("");
  return `<section>
    <div class="sechead"><h2>Year by year</h2>
      <span class="note">Every rupee in and out, from now to age ${state.a.lifeExpectancy}. &ldquo;Drawn from&rdquo; is the gross taken out of each holding, and the tax each one paid &mdash; a holding taxed every year pays on its growth even when nothing is withdrawn from it.</span>
      <span class="spacer"></span>
      <button class="btn" id="csvBtn">Download as CSV</button></div>
    <div class="panel"><div class="tblwrap"><table>
      <thead><tr><th class="r">Year</th><th class="r">Age</th><th></th><th class="r">Opening</th><th class="r">Invested</th>
        <th class="r">Growth</th><th class="r">Goals</th><th class="r">Living costs</th><th class="r">Tax</th><th class="r">Closing</th><th class="r">Surplus / short</th><th>Drawn from, and tax</th><th>What happens</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>
  </section>`;
}

        <div class="chartbox" id="flowBox"></div>

`;

/* Lifted from the v37 planner page (_archive/v37_reference) on 2026-09-19; edited since. */
/* ------------------------------------------------------------- rendering */
function render(){
  recompute();
  verdict();
  const main = document.getElementById("main");
  const roll = rollNote ? `<div class="rollnote"><div><b>A new year has started.</b>
      ${rollNote.years.length === 1 ? rollNote.years[0] + " has closed" : rollNote.years.join(", ") + " have closed"}
      and now counts towards the on-track comparison, and ${rollNote.to} has opened. Check that the closing
      figure for ${rollNote.years[rollNote.years.length-1]} is the real year-end one, then update the holdings
      on the Portfolio tab to what they are worth now.</div>
      <div class="acts"><button class="btn" id="rollUndoBtn">Undo</button>
      <button class="btn" id="rollOkBtn">Got it</button></div></div>` : "";
  if (activeTab === "dash")      main.innerHTML = dashTab();
  else if (activeTab === "inv")  main.innerHTML = investmentsTab();
  else if (activeTab === "goals")main.innerHTML = goalsTab();
  else if (activeTab === "hist") main.innerHTML = historyTab();
  else                           main.innerHTML = yearsTab();
  if (roll) main.insertAdjacentHTML("afterbegin", roll);
  if (activeTab === "dash") paintCharts();
}

/* soft update: recompute and repaint everything except live input fields */
function softUpdate(){
  recompute();
  verdict();
  if (activeTab === "dash"){
    const set = (sel, html) => { const el = document.querySelector(sel); if (el) el.innerHTML = html; };
    const secs = document.querySelectorAll("#main > section");
    if (secs[0]) secs[0].innerHTML = banner();
    if (secs[1]) secs[1].innerHTML = tiles();
    if (secs[3]) secs[3].querySelector(".fixgrid, .callout")?.replaceWith(nodeFrom(fixes()));
    if (secs[4]) { const p = secs[4].querySelector(".panel"); if (p) p.replaceWith(nodeFrom(goalTable())); }
    void set;
    paintCharts();
  } else if (activeTab === "inv"){
    const tv = state.investments.filter(i=>i.on).reduce((t,i)=>t+num(i.val),0);
    const ta = state.investments.filter(i=>i.on).reduce((t,i)=>t+num(i.add),0);
    const a = document.querySelector('[data-live="ivTotal"]'); if (a) a.textContent = inr(tv);
    const b = document.querySelector('[data-live="ivAdd"]');   if (b) b.textContent = inr(ta);
    const c = document.querySelector('[data-live="ivRet"]');   if (c) c.textContent = "blended " + pct(MODEL.proj.m.blendedReturn,2);
  } else if (activeTab === "hist"){
    const t = MODEL.trk;
    t.rows.forEach(r => {
      const p = document.querySelector(`[data-planned="${r.id}"]`);
      const g = document.querySelector(`[data-gap="${r.id}"]`);
      if (p) p.textContent = r.planned != null ? short(r.planned) : "—";
      if (g){
        g.textContent = r.gap != null ? ((r.gap>=0?"+":"") + short(r.gap)) : "—";
        g.style.color = r.gap != null ? (r.gap>=0 ? "var(--good)" : "var(--critical)") : "var(--muted)";
      }
    });
    const box = document.getElementById("histChartBox");
    if (box){ const c = histChart(); box.innerHTML = c || ""; }
    const ro = document.getElementById("histReadout");
    if (ro) ro.innerHTML = histReadout();
  }
  markDirty();
}
function nodeFrom(html){ const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }

function paintCharts(){
  const cbox = document.getElementById("corpusBox");
  if (cbox){
    const c = corpusChart();
    cbox.innerHTML = c.svg + `<div class="tip" id="ctip"></div>`;
    wireCorpusHover(cbox, c);
  }
  const fbox = document.getElementById("flowBox");
  if (fbox){
    const f = flowChart();
    fbox.innerHTML = f.svg + `<div class="tip" id="ftip"></div>`;
    wireFlowHover(fbox, f);
  }
}

function hoverIndex(box, evt, count, mapX){
  const svg = box.querySelector("svg"), r = svg.getBoundingClientRect();
  const vx = (evt.clientX - r.left) / r.width * CW;
  let best = 0, bd = Infinity;
  for (let i = 0; i < count; i++){ const d = Math.abs(mapX(i) - vx); if (d < bd){ bd = d; best = i; } }
  return {i: best, rect: r};
}

function wireCorpusHover(box, c){
  const svg = box.querySelector("svg"), tip = box.querySelector("#ctip"), cx = svg.querySelector("#cx");
  const years = MODEL.proj.years;
  /* Every point on the purple "actually recorded" line gets its own tooltip too, built from the
     history row itself: Opening is the prior recorded year's Closing, and Plan would say /
     Difference reuse track()'s own numbers — the same ones the History tab shows. A row with
     nothing earlier to compare against (the very first one, or one track() can't yet place on
     the plan curve) just shows whatever it has, where only limited information is available. */
  const liveY = state.a.currentYear;
  const histRows = MODEL.trk.rows.filter(r => num(r.year) < liveY).sort((a,b) => num(a.year) - num(b.year));
  const candidates = histRows.map(r => ({kind:"hist", year:num(r.year), row:r}))
    .concat(years.map(y => ({kind:"proj", year:y.year, row:y})));
  const move = e => {
    const {i, rect} = hoverIndex(box, e, candidates.length, k => c.X(candidates[k].year));
    const cand = candidates[i];
    const row = (l,v,col) => `<div class="tr"><span>${col?`<span class="sw" style="background:${col}"></span>`:""}${l}</span><b>${v}</b></div>`;
    let px, py, html;

    if (cand.kind === "proj"){
      const y = cand.row;
      px = c.X(y.year); py = c.Y(y.closing);
      const rqAll = reqEndFor(years, reqCurve); const rq = rqAll ? rqAll[years.indexOf(y)] : null;
      html = `<div class="th">${y.year} &middot; age ${y.age}${y.phase==="Retirement"?" &middot; retired":""}</div>`
        + row("Opening", short(y.opening))
        + (y.contribution ? row("Invested", short(y.contribution), "var(--s1)") : "")
        + row("Growth", short(y.growth), "var(--s2)")
        + (y.goalSpend ? row("Goals", "−"+short(y.goalSpend), "var(--s3)") : "")
        + (y.tax ? row("Tax", "−"+short(y.tax), "var(--s5)") : "")
        + (y.retSpend ? row("Living costs", "−"+short(y.retSpend), "var(--s4)") : "")
        + row("<b>Closing</b>", "<b>"+short(y.closing)+"</b>")
        + (y.shortfall > 1 ? `<div class="tr" style="color:var(--critical)"><span>Unfunded</span><b>${short(y.shortfall)}</b></div>` : "")
        + (rq != null ? `<div class="tr" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px">
             <span>Needed by then</span><b>${short(rq)}</b></div>
           <div class="tr"><span>${y.closing - rq >= 0 ? "Surplus" : "Short by"}</span>
             <b style="color:${y.closing-rq>=0?"var(--good)":"var(--critical)"}">${short(Math.abs(y.closing-rq))}</b></div>` : "");
    } else {
      const r = cand.row;
      const idx = histRows.indexOf(r);
      const prev = idx > 0 ? histRows[idx-1] : null;
      const opening = prev ? num(prev.actual) : null;
      const invested = num(r.contribution);
      const growth = opening != null ? num(r.actual) - opening - invested : null;
      const age = state.a.currentAge + (num(r.year) - liveY);
      px = c.X(cand.year); py = c.Y(num(r.actual));
      let tail = "";
      if (r.estimated){
        tail = `<div class="tr" style="color:var(--muted);font-style:italic;border-top:1px solid var(--line);margin-top:4px;padding-top:4px">${esc(r.note || "Estimated, not a recorded value")}</div>`;
      } else if (r.planned != null){
        tail = `<div class="tr" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>Plan would say</span><b>${short(r.planned)}</b></div>`
          + `<div class="tr"><span>Difference</span><b style="color:${r.gap>=0?"var(--good)":"var(--critical)"}">${(r.gap>=0?"+":"")+short(r.gap)}</b></div>`;
      } else if (opening == null){
        tail = `<div class="tr" style="color:var(--muted);font-style:italic">Earliest year recorded &mdash; nothing earlier to compare</div>`;
      }
      html = `<div class="th">${r.year} &middot; age ${age}${r.estimated?" &middot; estimated":""}</div>`
        + (opening != null ? row("Opening", short(opening)) : "")
        + (invested ? row("Invested", short(invested), "var(--s1)") : "")
        + (growth != null ? row("Growth", short(growth), "var(--s2)") : "")
        + row("<b>Closing</b>", "<b>"+short(num(r.actual))+"</b>")
        + tail;
    }

    cx.style.opacity = 1;
    cx.querySelector("line").setAttribute("x1", px); cx.querySelector("line").setAttribute("x2", px);
    cx.querySelector("circle").setAttribute("cx", px); cx.querySelector("circle").setAttribute("cy", py);
    tip.innerHTML = html;
    tip.style.opacity = 1;
    const sx = rect.width / CW;
    let left = px * sx + 14;
    if (left + 190 > rect.width) left = px * sx - 190;
    tip.style.left = Math.max(0, left) + "px";
    tip.style.top = Math.max(0, Math.min(py * sx - 20, rect.height - 150)) + "px";
  };
  svg.addEventListener("mousemove", move);
  svg.addEventListener("mouseleave", () => { tip.style.opacity = 0; cx.style.opacity = 0; });
}

function wireFlowHover(box, f){
  const svg = box.querySelector("svg"), tip = box.querySelector("#ftip");
  const years = f.years;
  svg.addEventListener("mousemove", e => {
    const {i, rect} = hoverIndex(box, e, years.length, k => f.X(k));
    const y = years[i];
    const row = (l,v,col) => `<div class="tr"><span><span class="sw" style="background:${col}"></span>${l}</span><b>${v}</b></div>`;
    tip.innerHTML = `<div class="th">${y.year} &middot; age ${y.age}</div>`
      + (y.contribution ? row("Invested", short(y.contribution), "var(--s1)") : "")
      + row("Growth", short(y.growth), "var(--s2)")
      + (y.goalSpend ? row("Goal spending", short(y.goalSpend), "var(--s3)") : "")
      + (y.retSpend ? row("Living costs", short(y.retSpend), "var(--s4)") : "")
      + (y.tax ? row("Tax", short(y.tax), "var(--s5)") : "")
      + (y.shortfall > 1 ? `<div class="tr" style="color:var(--critical)"><span><span class="sw" style="background:var(--crit-wash);outline:1px dashed var(--critical)"></span>Needed but not paid</span><b>${short(y.shortfall)}</b></div>` : "")
      + `<div class="tr" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>Net</span><b>${short(y.contribution+y.growth-y.outflow)}</b></div>`;
    tip.style.opacity = 1;
    const sx = rect.width / CW;
    let left = f.X(i) * sx + 14;
    if (left + 190 > rect.width) left = f.X(i) * sx - 190;
    tip.style.left = Math.max(0, left) + "px";
    tip.style.top = "10px";
  });
  svg.addEventListener("mouseleave", () => { tip.style.opacity = 0; });
}

/* Lifted from the v37 planner page (_archive/v37_reference) on 2026-09-19; edited since. */
function recordSnapshot(){
  normalize(state);
  const liveY = asOfYear(state);
  const row = state.history.find(h => num(h.year) === liveY);
  if (!row) return;
  const on = state.investments.filter(i => i.on);
  const total = on.reduce((t,i) => t + num(i.val), 0);
  const byInv = {}; on.forEach(i => byInv[i.id] = num(i.val));
  const date = normDate(state.a.asOf);
  const dup = (row.snaps || []).find(sn => sn.date === date);
  if (dup){ dup.total = total; dup.byInv = byInv; }
  else row.snaps.push({id:uid("sn"), date, total, added:0, note:"", byInv});
  normalize(state);
  activeTab = "hist";
  render(); markDirty();
  flash((dup ? "updated " : "recorded ") + dateShort(date));
}

function applySnap(tr, el){
  const h = state.history.find(x => x.id === tr.dataset.hid); if (!h) return;
  const sn = (h.snaps || []).find(x => x.id === tr.dataset.sid); if (!sn) return;
  const k = el.dataset.sn;
  if (k === "note") sn.note = el.value;
  else if (k === "added") sn.added = mnum(el.value);
  else if (k === "date"){
    const d = normDate(el.value, h.year);
    sn.date = d;
    /* a reading moved into another year belongs to that year's row */
    if (dateYear(d) !== num(h.year)){
      h.snaps = h.snaps.filter(x => x.id !== sn.id);
      let target = state.history.find(x => num(x.year) === dateYear(d));
      if (!target){
        target = {id:uid("h"), year:dateYear(d), actual:sn.total, contribution:0, snaps:[], note:""};
        state.history.push(target);
      }
      target.snaps.push(sn);
    }
  }
  normalize(state);
}

/* ---- src/ui/events.js ---- */
/* Lifted from the v37 planner page (_archive/v37_reference) on 2026-09-19; edited since. */
/* ================================================================ events */
/* Listeners attach once, after the shell has rendered its root markup. */
function wireEvents(){
  document.getElementById("tabs").addEventListener("click", e => {
    const b = e.target.closest(".tab"); if (!b) return;
    activeTab = b.dataset.tab;
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t === b)));
    render();
  });

  /* Editing the as-of date is an explicit statement about which year the plan
     sits in, so it also acknowledges the current year — otherwise entering an
     old snapshot would immediately trip the rollover and undo the edit. */
  function applyAsOf(){
    const el = document.getElementById("asOfDate");
    if (!el || !/^\d{4}-\d{2}-\d{2}$/.test(el.value)) return;   // mid-typing, ignore
    state.a.asOf = el.value;
    state.a.rolledThrough = Math.max(num(state.a.rolledThrough), new Date().getFullYear() - 1);
    normalize(state);
  }

  document.getElementById("main").addEventListener("input", e => {
    const el = e.target;
    if (el.id === "cgExempt"){ state.a.cgExempt = mnum(el.value); softUpdate(); return; }
    if (el.dataset.as !== undefined){ applyAssumption(el); softUpdate(); return; }
    const tr = el.closest("tr");
    if (!tr) return;
    if (el.dataset.iv !== undefined){ applyInv(tr.dataset.id, el); softUpdate(); }
    else if (el.dataset.gl !== undefined){ applyGoal(tr.dataset.id, el); softUpdate(); }
    else if (el.dataset.hs !== undefined){ applyHist(tr, el); softUpdate(); }
    else if (el.dataset.sn !== undefined){ applySnap(tr, el); softUpdate(); }
  });

  document.getElementById("main").addEventListener("change", e => {
    const el = e.target;
    if (el.id === "asOfDate"){
      applyAsOf(); setTimeout(() => { render(); markDirty(); }, 0); return; }
    if (el.dataset.sn === "date"){
      const tr = el.closest("tr");
      if (tr){ applySnap(tr, el); setTimeout(() => { render(); markDirty(); }, 0); }
      return;
    }
    /* holdings are kept in withdraw-priority order; re-sort once the number is
       committed, never while it is being typed */
    if (el.dataset.iv === "pri"){ sortHoldings(state); render(); markDirty(); return; }
    if (el.type === "checkbox" || el.tagName === "SELECT"){
      if (el.dataset.as !== undefined){ applyAssumption(el); render(); return; }
      const tr = el.closest("tr"); if (!tr) return;
      if (el.dataset.iv !== undefined) applyInv(tr.dataset.id, el);
      else if (el.dataset.gl !== undefined) applyGoal(tr.dataset.id, el);
      render(); markDirty();
    }
  });

  document.getElementById("main").addEventListener("click", e => {
    if (e.target.id === "snapBtn"){ recordSnapshot(); return; }
    if (e.target.id === "asOfToday"){
      state.a.asOf = systemDate();
      state.a.rolledThrough = Math.max(num(state.a.rolledThrough), new Date().getFullYear() - 1);
      normalize(state); render(); markDirty(); return;
    }
    if (e.target.id === "rollOkBtn"){ rollNote = null; render(); return; }
    if (e.target.id === "rollUndoBtn"){
      if (rollUndo){ state = rollUndo; rollUndo = null; normalize(state); }
      rollNote = null; render(); markDirty(); flash("rollover undone"); return;
    }
    const kindBtn = e.target.closest("[data-kind]");
    if (kindBtn && !kindBtn.disabled){
      const g = state.goals.find(x => x.id === kindBtn.closest("tr").dataset.id);
      if (g){ g.kind = kindBtn.dataset.kind; if (g.kind === "onetime") g.end = g.start;
              else if (g.end <= g.start) g.end = Math.min(g.start + 10, A.endYear(state)); }
      render(); markDirty(); return;
    }
    const del = e.target.closest("[data-del]");
    if (del){
      const tr = del.closest("tr");
      if (del.dataset.del === "inv")  state.investments = state.investments.filter(i => i.id !== tr.dataset.id);
      if (del.dataset.del === "goal") state.goals = state.goals.filter(g => g.id !== tr.dataset.id);
      if (del.dataset.del === "hist"){
        const gone = state.history.find(h => h.id === tr.dataset.id);
        if (gone && gone.estimated) state.a.noEstimate = true;     // removed on purpose: stay removed
        state.history = state.history.filter(h => h.id !== tr.dataset.id);
      }
      if (del.dataset.del === "snap"){
        const h = state.history.find(x => x.id === tr.dataset.hid);
        if (h) h.snaps = (h.snaps || []).filter(x => x.id !== tr.dataset.sid);
      }
      normalize(state);
      render(); markDirty(); return;
    }
    const add = e.target.closest("[data-add]");
    if (add){
      const cy = state.a.currentYear;
      if (add.dataset.add === "inv")
        state.investments.push({id:uid("i"), name:"New holding", cat:"Equity", owner:"",
          val:0, cost:0, add:0, step:0, ret:0.10, until:null, avail:null, on:true,
          pri: state.investments.reduce((m,i) => Math.max(m, num(i.pri,1)), 0) + 1,
          taxWhen:taxDefault("Equity").when, taxRate:taxDefault("Equity").rate});
      if (add.dataset.add === "goal")
        state.goals.push({id:uid("g"), name:"New goal", kind:"onetime", start:cy+3, end:cy+3, amt:1000000, infl:0.06, ess:false, on:true, isRet:false});
      if (add.dataset.add === "goalrec")
        state.goals.push({id:uid("g"), name:"New recurring goal", kind:"recurring", start:cy, end:cy+10, amt:300000, infl:0.06, ess:false, on:true, isRet:false});
      if (add.dataset.add === "hist"){
        const yrs = state.history.map(h => h.year);
        const y = yrs.length ? Math.min.apply(null, yrs) - 1 : cy - 1;
        state.history.push({id:uid("h"), year:y, actual:0, contribution:0, note:"", snaps:[]});
      }
      render(); markDirty(); return;
    }
    if (e.target.id === "csvBtn") exportCsv();
  });

  document.getElementById("main").addEventListener("focusin", e => {
    const el = e.target;
    if (el.classList && el.classList.contains("money")){
      /* strip the grouping separators for editing, then select the lot — assigning
         value moves the caret to the end, and without this a typed figure would
         land on the end of the old one instead of replacing it */
      const v = mnum(el.value); el.value = v ? String(v) : "";
      try { el.select(); } catch(e){ /* not selectable, no matter */ }
    }
  });
  document.getElementById("main").addEventListener("focusout", e => {
    const el = e.target;
    if (el.classList && el.classList.contains("money")) el.value = IN.format(mnum(el.value));
  });
}

function applyAssumption(el){
  const k = el.dataset.as;
  if (k === "usePostRet") state.a.usePostRet = el.checked;
  else if (k === "postRetReturn") state.a.postRetReturn = num(el.value)/100;
  else state.a[k] = Math.round(num(el.value));
  normalize(state);
}
function applyInv(id, el){
  const i = state.investments.find(x => x.id === id); if (!i) return;
  const k = el.dataset.iv;
  if (k === "on") i.on = el.checked;
  else if (k === "cat"){
    /* move the category and rate to the new type's defaults, but only while
       they still sit on the old type's — never overwrite a real edit */
    const was = taxDefault(i.cat);
    const untouched = Math.abs(num(i.taxRate) - was.rate) < 1e-9 && i.taxWhen === was.when;
    i.cat = el.value;
    if (untouched){ const now = taxDefault(i.cat); i.taxWhen = now.when; i.taxRate = now.rate; }
  }
  else if (k === "taxWhen") i.taxWhen = el.value;
  else if (k === "taxRate") i.taxRate = Math.max(0, num(el.value)/100);
  else if (k === "pri") i.pri = Math.max(1, Math.round(num(el.value)));
  else if (k === "name" || k === "owner") i[k] = el.value;
  else if (k === "ret" || k === "step") i[k] = num(el.value)/100;
  else if (k === "until" || k === "avail") i[k] = el.value === "" ? null : Math.round(num(el.value));
  else i[k] = mnum(el.value);
}
function applyGoal(id, el){
  const g = state.goals.find(x => x.id === id); if (!g) return;
  const k = el.dataset.gl;
  if (k === "on") g.on = el.checked;
  else if (k === "ess") g.ess = el.checked;
  else if (k === "name") g.name = el.value;
  else if (k === "infl") g.infl = num(el.value)/100;
  else if (k === "start" || k === "end") g[k] = Math.round(num(el.value));
  else g[k] = mnum(el.value);
  if (g.kind === "onetime") g.end = g.start;
}
function applyHist(tr, el){
  const h = state.history.find(x => x.id === tr.dataset.id); if (!h) return;
  const k = el.dataset.hs;
  if (k === "note") h.note = el.value;
  else if (k === "year") h.year = Math.round(num(el.value));
  else h[k] = mnum(el.value);
  /* a real figure typed into the estimated year retires the estimate, silently,
     and it is never derived over again */
  if (h.estimated && k === "actual"){
    delete h.estimated;
    if (String(h.note || "").startsWith("Estimated, not a recorded value")) h.note = "";
  }
}

/* ---- src/ui/app.js ---- */
/* ================================================================== app
   The shell: page state, header, the empty state, Load / Save wiring, the
   unsaved counter and the boot. Replaces the whole persistence section of
   the v37 planner page (_archive/v37_reference).

   The page always opens EMPTY. Nothing is remembered between sessions: a
   plan enters only through Load (or the sample) and leaves only through
   Save. See src/storage/files.js for how Save works where.               */

let state = null;          // the plan, in memory only; null = nothing open
let MODEL = null;
let activeTab = "dash";
let reqCurve = null, reqTimer = null;
let rollNote = null, rollUndo = null;

/* what the header needs to know about the plan that is open */
const DOC = {
  origin: null,            // "file" | "sample"
  name: null,              // what to call it in the header
  knownText: null,         // the bytes last read from / written to disk
  dirty: false,
  since: null              // when it was opened or last saved
};

const APP_VERSION = "v1.0.0";

/* ---------------------------------------------------------- recompute */
function recompute(){
  normalize(state);
  ensureEstimate(state);          // keeps a still-estimated year in step with the one it came from
  const proj = project(state);
  MODEL = {proj, trk: track(state), fix: solveAll(state)};
  scheduleRequired();
  return MODEL;
}

/* The required curve costs a few hundred milliseconds, far too much for every
   keystroke, so it is computed once editing settles. While stale, the old one
   stays on the chart; it is dropped only when the year count changes. */
function scheduleRequired(){
  if (reqTimer) clearTimeout(reqTimer);
  reqTimer = setTimeout(() => {
    reqTimer = null;
    if (!state || !MODEL) return;
    try { reqCurve = requiredCurve(state, MODEL.proj); }
    catch(e){ reqCurve = null; }
    if (activeTab === "dash") paintCharts();
    if (activeTab === "years") render();
  }, 260);
}

/* ------------------------------------------------------------- export */
function exportCsv(){
  const ys = MODEL.proj.years;
  let rq = reqEndFor(ys, reqCurve);
  if (!rq){ try { reqCurve = requiredCurve(state, MODEL.proj); rq = reqEndFor(ys, reqCurve); } catch(e){ rq = null; } }
  offerDownload("goal_planner_projection.csv", toCsv(yearRows(state, ys, rq)), "text/csv")
    .then(r => {
      if (r.ok) flash("downloaded");
      else if (!r.declined) flash("could not download");
    });
}

/* ------------------------------------------------------------ messages */
function flash(msg){
  const el = document.getElementById("saveInd");
  if (!el || !msg) return;
  el.textContent = msg;
  setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 2600);
}
function notice(kind, html){
  const box = document.getElementById("notices");
  if (!box) return null;
  const el = document.createElement("div");
  el.className = "notice" + (kind === "warn" ? " warn" : "");
  el.innerHTML = `<div>${html}</div><button class="x" aria-label="Dismiss">&times;</button>`;
  el.querySelector(".x").addEventListener("click", () => el.remove());
  box.appendChild(el);
  return el;
}
function clearNotices(){ const b = document.getElementById("notices"); if (b) b.innerHTML = ""; }

/* An in-page question, not a browser confirm box: nothing modal, and the
   answer buttons sit where the eye already is. */
function askInline(html, yes, no){
  return new Promise(resolve => {
    const box = document.getElementById("notices");
    const el = document.createElement("div");
    el.className = "notice warn ask";
    el.innerHTML = `<div>${html}</div><div class="acts">
      <button class="btn btn-accent" data-a="1">${esc(yes)}</button>
      <button class="btn" data-a="0">${esc(no)}</button></div>`;
    el.addEventListener("click", e => {
      const b = e.target.closest("[data-a]"); if (!b) return;
      el.remove(); resolve(b.dataset.a === "1");
    });
    box.prepend(el);
    el.querySelector("[data-a='1']").focus();
  });
}

/* ------------------------------------------------------------- dirty */
function markDirty(){
  if (!state) return;
  DOC.dirty = true;
  paintStatus();
}

function ago(d){
  const min = Math.floor((Date.now() - d.getTime()) / 60000);
  if (min < 1) return "just now";
  if (min < 60) return min + " min";
  const h = Math.floor(min / 60);
  return h + " h " + (min % 60) + " min";
}

function paintStatus(){
  const pill = document.getElementById("storePill"), txt = document.getElementById("storeTxt");
  const save = document.getElementById("planSave");
  if (!pill) return;
  if (!state){
    pill.className = "storepill"; txt.textContent = "no plan open";
    pill.title = "Load a plan file, or start from the sample.";
  } else if (DOC.dirty){
    pill.className = "storepill warn";
    const a = ago(DOC.since);
    txt.textContent = DOC.origin === "sample" && !DOC.knownText
      ? "unsaved sample — " + (a === "just now" ? "started just now" : a + " since you started")
      : "unsaved — " + (a === "just now" ? "changed since last save" : a + " since last save");
    pill.title = "Changes are only in this tab. Closing it loses them. Press Save.";
  } else {
    pill.className = "storepill live";
    txt.textContent = DOC.name;
    pill.title = "What you see matches the file.";
  }
  if (save){
    save.hidden = !state;
    save.className = "btn" + (state && DOC.dirty ? " btn-accent" : "");
  }
}

/* ------------------------------------------------------------- shell */
function shellHtml(){
  return `
<div class="safety" role="note">
  <div class="wrap safetyin">
    <span><b>Your figures never leave your computer.</b> This page has no server and keeps no copy of anything:
    <b>Load</b> reads a plan file inside your browser, and <b>Save</b> puts it back
    on your own disk. Close the tab and nothing is left behind.</span>
  </div>
</div>
<div class="top">
  <div class="wrap">
    <div class="topin">
      <div class="brand">
        <h1>Goal Planner</h1>
        <span class="sub">Financial plan &middot; ${esc(APP_VERSION)}</span>
      </div>
      <div id="verdictPill"></div>
      <div class="planbar">
        <span class="storepill" id="storePill"><span class="dot"></span><span id="storeTxt">no plan open</span></span>
        <button class="btn" id="planLoad" title="Open a goal_plan.json (or an older plan.js) from your computer">Load plan&hellip;</button>
        <button class="btn" id="planSave" hidden
          title="${saveMode() === "download"
            ? "Downloads goal_plan.json"
            : "Asks for a folder, writes goal_plan.json there, and keeps the copy it replaces in backups/"}">${saveMode() === "download" ? "Download plan" : "Save plan&hellip;"}</button>
        <input type="file" id="planFile" accept=".json,.js,application/json,text/javascript" hidden>
      </div>
      <div class="saveind" id="saveInd" aria-live="polite"></div>
    </div>
    <div class="tabs" role="tablist" id="tabs" hidden>
      <button class="tab" role="tab" data-tab="dash" aria-selected="true">Dashboard</button>
      <button class="tab" role="tab" data-tab="inv" aria-selected="false">Portfolio</button>
      <button class="tab" role="tab" data-tab="goals" aria-selected="false">Goals</button>
      <button class="tab" role="tab" data-tab="hist" aria-selected="false">History</button>
      <button class="tab" role="tab" data-tab="years" aria-selected="false">Year by year</button>
    </div>
  </div>
</div>
<div id="notices"></div>
<main class="wrap" id="main"></main>`;
}

/* The page ALWAYS opens here. Two ways in, nothing else. */
function renderWelcome(){
  document.getElementById("tabs").hidden = true;
  document.getElementById("verdictPill").innerHTML = "";
  document.getElementById("main").innerHTML = `
    <section class="welcome panel">
      <h2>Open a plan to begin</h2>
      <p>Nothing is open. This page does not remember anything from last time.</p>
      <div class="wbtns">
        <button class="btn btn-accent btn-lg" id="welcomeLoad">Load a plan&hellip;</button>
        <button class="btn btn-lg" id="welcomeSample">Start with a sample plan</button>
      </div>
      <p class="hint">A plan is a <code>goal_plan.json</code> file. An older <code>plan.js</code> opens too.</p>
    </section>`;
  paintStatus();
}

function showPlan(){
  document.getElementById("tabs").hidden = false;
  activeTab = "dash";
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === "dash")));
  reqCurve = null;
  render();
  paintStatus();
}

/* ------------------------------------------------------------- load */
async function loadFile(file){
  if (state && DOC.dirty){
    const go = await askInline(`<b>${esc(DOC.name)}</b> has changes that are not saved. Open <b>${esc(file.name)}</b> and lose them?`,
      "Discard changes and open", "Keep editing");
    if (!go) return;
  }
  const r = await readPlanFile(file);
  if (!r.ok){ notice("warn", esc(r.error)); return; }
  const m = merge(r.loaded);
  if (!m.ok){
    notice("warn", m.error === "newer"
      ? `<b>${esc(file.name)} was written by a newer version of the planner</b> (data v${m.dataVersion}; this page reads up to v${m.pageVersion}). It has been left untouched &mdash; open it with the newer page.`
      : `<b>${esc(file.name)}</b> could not be opened as a plan.`);
    return;
  }
  clearNotices();
  state = m.state;
  const rn = rollForward(state, new Date());
  rollNote = rn; rollUndo = rn ? rn.undo : null;
  const est = ensureEstimate(state);
  Object.assign(DOC, {origin: "file", name: file.name, knownText: r.text,
                      dirty: !!rn || r.kind === "js" || est, since: new Date()});
  showPlan();
  if (est){
    const e = state.history.find(h => h.estimated);
    notice("", `<b>Added an estimated ${e.year} to History.</b> With only one recorded year there was nothing to compare; `
      + `the estimate gives the chart a slope but is left out of the on-track figures. Type the real ${e.year} value to replace it.`);
  }
  if (r.kind === "js")
    notice("", `<b>Opened ${esc(file.name)}, an older-format plan.</b> Save writes it as <b>goal_plan.json</b>; `
      + `${esc(file.name)} itself is left exactly as it is.`);
}

function startSample(){
  state = merge(defaultState()).state;
  const rn = rollForward(state, new Date());
  rollNote = rn; rollUndo = rn ? rn.undo : null;
  Object.assign(DOC, {origin: "sample", name: "sample plan", knownText: null, dirty: true, since: new Date()});
  clearNotices();
  showPlan();
  notice("", `<b>Sample figures &mdash; a made-up household, not anybody's real accounts.</b> Type over anything on the `
    + `Portfolio, Goals and History tabs. Nothing is saved until you press <b>${saveMode() === "download" ? "Download plan" : "Save plan"}</b>.`);
}

/* ------------------------------------------------------------- save */
let saving = false;
async function doSave(){
  if (!state || saving) return;
  saving = true;
  const btn = document.getElementById("planSave");
  if (btn) btn.disabled = true;
  try {
    const prevSavedAt = state.savedAt;
    state.savedAt = new Date().toISOString();
    const text = serialiseJson(state);
    const folderish = saveMode() !== "download";
    const r = await savePlanText(text, {
      isKnown: t => !!DOC.knownText && t.trim() === DOC.knownText.trim(),
      confirmReplace: (where, summary) => askInline(
        `<b>${esc(where)}</b> already holds a different plan (${esc(summary)}). Replace it with the one on screen?`
        + (folderish ? " The file it replaces will be kept in <b>backups/</b>." : ""),
        "Replace it", "Cancel")
    });
    if (!r.ok){
      state.savedAt = prevSavedAt;
      if (r.error) notice("warn", `<b>Not saved.</b> ${esc(r.error)}`);
      else flash("not saved");
      return;
    }
    Object.assign(DOC, {origin: "file", name: r.where, knownText: text, dirty: false, since: new Date()});
    clearNotices();
    let msg = r.mode === "download"
      ? `<b>Downloaded goal_plan.json.</b> It is in your browser's downloads; move it wherever you keep your plan.`
      : `<b>Saved to ${esc(r.where)}.</b>`;
    if (r.backup) msg += ` The copy it replaced is kept as <b>${esc(r.backup)}</b>.`;
    if (r.pruned) msg += ` (${r.pruned} older backup${r.pruned > 1 ? "s" : ""} removed; the newest ${KEEP_BACKUPS} are kept.)`;
    if (r.note) msg += " " + esc(r.note);
    notice("", msg);
    flash("saved");
  } catch(e){
    notice("warn", `<b>Not saved.</b> ${esc(e && e.message || String(e))}`);
  } finally {
    saving = false;
    if (btn) btn.disabled = false;
    paintStatus();
  }
}

/* ------------------------------------------------------------- boot */
function boot(){
  const root = document.getElementById("gp-root");
  root.innerHTML = shellHtml();
  wireEvents();

  const file = document.getElementById("planFile");
  const pick = () => { file.value = ""; file.click(); };
  file.addEventListener("change", () => { const f = file.files && file.files[0]; if (f) loadFile(f); });
  document.getElementById("planLoad").addEventListener("click", pick);
  document.getElementById("planSave").addEventListener("click", doSave);
  document.getElementById("main").addEventListener("click", e => {
    if (e.target.id === "welcomeLoad") pick();
    if (e.target.id === "welcomeSample") startSample();
  });

  /* Losing work silently is worth one dialog. */
  window.addEventListener("beforeunload", e => {
    if (!state || !DOC.dirty) return;
    e.preventDefault(); e.returnValue = "";
  });
  setInterval(paintStatus, 30000);

  renderWelcome();
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
</script>
</body>
</html>
